      - name: Guardar lo que programas, cifrado, y que vuelva al reiniciar
        run: |
          cat > quedan.py <<'FIN'
          import os, re, shutil, subprocess, sys, time

          TECLA = {" ": "spc", '"': "shift-2", "(": "shift-8", ")": "shift-9", "-": "slash", "_": "shift-slash",
                   ".": "dot", ",": "comma", ":": "shift-dot", "ñ": "semicolon",
                   "á": "apostrophe a", "é": "apostrophe e", "í": "apostrophe i", "ó": "apostrophe o", "ú": "apostrophe u"}
          TECLA.update({letra: "shift-" + letra.lower() for letra in "ABCDEFGHIJKLMNOPQRSTUVWXYZ"})
          ABREN = ("si", "mientras", "repite", "para", "funcion")
          ZONA = 8193 - 1600

          CUENTAS = '''
          funcion doble con n
              devuelve n por 2
          fin
          para cada i desde 1 hasta 3
              escribe doble con i
          fin
          escribe "año y canción"
          '''


          class Ordenador:
              def __init__(self, nombre):
                  self.nombre = nombre
                  self.serie = nombre + ".txt"
                  if os.path.exists(self.serie):
                      os.remove(self.serie)
                  self.qemu = subprocess.Popen(
                      ["qemu-system-x86_64", "-m", "256", "-cpu", "max", "-kernel", "sistema.bin",
                       "-drive", "file=quedan.img,format=raw,if=ide",
                       "-display", "none", "-serial", "file:" + self.serie, "-monitor", "stdio", "-no-reboot"],
                      stdin=subprocess.PIPE, stdout=subprocess.DEVNULL)
                  self.espera("pantalla lista", 1, 60)
                  time.sleep(2)

              def pide(self, orden, pausa=0.12):
                  self.qemu.stdin.write((orden + "\n").encode())
                  self.qemu.stdin.flush()
                  time.sleep(pausa)

              def pulsa(self, *teclas):
                  for tecla in teclas:
                      self.pide("sendkey " + tecla)

              def escribe(self, texto):
                  for letra in texto:
                      self.pulsa(*TECLA.get(letra, letra).split())

              def orden(self, texto, pausa=1.5):
                  self.escribe(texto)
                  self.pide("sendkey ret", pausa)

              def programa(self, codigo):
                  previa = None
                  for linea in codigo.strip("\n").split("\n"):
                      quiere = len(linea) - len(linea.lstrip(" "))
                      sangria = 0
                      if previa is not None:
                          sangria = len(previa) - len(previa.lstrip(" "))
                          if previa.strip().split(" ")[0] in ABREN:
                              sangria += 4
                          self.pulsa("ret")
                      while sangria > quiere:
                          self.pulsa("backspace")
                          sangria -= 4
                      self.escribe(" " * (quiere - sangria) + linea.strip())
                      previa = linea

              def compila(self, codigo, nombre):
                  self.orden("lanza fal")
                  self.orden("teclado 1", 0.5)
                  self.programa(codigo)
                  self.pide("sendkey end", 0.5)
                  self.escribe(nombre)
                  self.pide("sendkey ret", 2)

              def dicho(self):
                  if not os.path.exists(self.serie):
                      return ""
                  with open(self.serie, encoding="utf-8", errors="replace") as serie:
                      return serie.read()

              def espera(self, frase, veces=1, segundos=60):
                  hasta = time.time() + segundos
                  while time.time() < hasta:
                      if self.dicho().count(frase) >= veces:
                          return
                      time.sleep(0.3)
                  self.falla("no dice " + frase)

              def en_pantalla(self, *frases):
                  time.sleep(1.5)
                  self.pide("pmemsave 0 134217728 %s.mem" % self.nombre, 3)
                  memoria = open(self.nombre + ".mem", "rb").read()
                  for frase in frases:
                      patron = b"".join(re.escape(bytes([letra])) + b"." for letra in frase.encode("cp437"))
                      if not re.search(patron, memoria, re.S):
                          self.falla("no está en la pantalla: " + frase)

              def no_dice(self, *frases):
                  for frase in frases:
                      if frase in self.dicho():
                          self.falla("no debía decir " + frase)

              def falla(self, por_que):
                  print(self.dicho())
                  self.qemu.kill()
                  sys.exit(por_que)

              def fuera(self):
                  self.pide("quit")
                  self.qemu.wait(20)
                  print(self.dicho())
                  if re.search(r"X  [A-Z]", self.dicho()):
                      sys.exit("Guardar lo programado ha tumbado a FalOS")


          def zona():
              imagen = open("quedan.img", "rb").read()
              return imagen, imagen[ZONA * 512:]


          def hueco_lleno():
              imagen, z = zona()
              llenos = [h for h in range(8) if z[h * 200 * 512:h * 200 * 512 + 4] == b"HEC1"]
              return llenos


          shutil.copy("disco.img", "quedan.img")

          o = Ordenador("quedan1")
