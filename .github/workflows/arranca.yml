name: Arranca

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrancar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar Fal
        run: |
          git clone --depth 1 https://github.com/NissanBoss/Fal.git /tmp/fal
          cd /tmp/fal && go build -o /usr/local/bin/fal .

      - name: Instalar QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86

      - name: Compilar FalOS y su disco
        run: |
          fal --nucleo sistema.fal 2> avisos.txt
          fal haz_disco.fal 2>> avisos.txt
          cat avisos.txt
          if grep -q "^  !" avisos.txt; then
            echo "Una variable pisa una constante"
            exit 1
          fi

      - name: Arrancar
        run: |
          timeout 20 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:serie.txt -no-reboot || true
          cat serie.txt
          if grep -q "  X  " serie.txt; then
            echo "FalOS revento al arrancar"
            exit 1
          fi
          grep -q "pantalla lista" serie.txt

      - name: Programas que intentan lo que no deben
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza apaga"
            sleep 4
            teclea "lanza espia"
            sleep 4
            teclea "lanza apaga"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:programas.txt -monitor stdio -no-reboot > /dev/null
          cat programas.txt
          if grep -q "  X  " programas.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "apaga cerrado por la excepción 13" programas.txt)" = 2
          grep -q "espia cerrado por la excepción 14" programas.txt

      - name: Permisos que se dan y se quitan
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza caja"
            teclea "lanza curioso"
            teclea "lanza ladron"
            sleep 2
            teclea "permite 2 1"
            sleep 3
            teclea "prohibe 2 1"
            sleep 1
            teclea "para 3"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:permisos.txt -monitor stdio -no-reboot > /dev/null
          cat permisos.txt
          if grep -q "  X  " permisos.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          grep -Eq "curioso pierde el permiso tras [1-9]" permisos.txt
          grep -Eq "ladron cerrado con 0 preguntas y [1-9]" permisos.txt

      - name: El teclado y el disco se cuelgan y vuelven
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga teclado"
            sleep 3
            teclea "lanza apaga"
            sleep 2
            teclea "rompe teclado"
            sleep 2
            teclea "cuelga disco"
            sleep 3
            teclea "rompe disco"
            sleep 2
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza fisgon"
            sleep 3
            teclea "lanza impostor"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 80 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:aparatos.txt -monitor stdio -no-reboot > /dev/null
          cat aparatos.txt
          if grep -q "  X  " aparatos.txt; then
            echo "Un aparato ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -Ec "archivo leido: [1-9]" aparatos.txt)" = 2
          grep -q "teclado reiniciado, y van 2" aparatos.txt
          grep -q "disco reiniciado, y van 2" aparatos.txt
          grep -q "apaga cerrado por la excepción 13" aparatos.txt
          grep -q "fisgon cerrado por la excepción 13" aparatos.txt
          grep -Eq "impostor cerrado con 0 preguntas y [1-9]" aparatos.txt

      - name: Discos hechos para romperlo
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          python3 - <<'FIN'
          sector = 512
          indice = (b"FALDISC2\n"
                    b"bien.txt 2 11\n"
                    b"vacio.txt 2 0\n"
                    b"lejos.txt 99999999 10\n"
                    b"gigante.txt 2 999999999999999999999999999\n"
                    b"negativo.txt -5 10\n"
                    b"nombre_de_mas_de_treinta_y_dos_letras_seguidas.txt 2 5\n"
                    b"ra\x07ro.txt 2 5\n"
                    b"grande.txt 2 31744\n")
          open("malo.img", "wb").write(indice.ljust(sector * 2, b" ") + b"hola, malo\n".ljust(sector * 62, b"x"))
          open("sin_salto.img", "wb").write(b"FALDISC2\n" + b"a" * (sector * 32 - 9))
          open("ruido.img", "wb").write(bytes(range(256)) * 128)
          FIN
          for disco in malo sin_salto ruido; do
            {
              sleep 4
              teclea "disco"
              sleep 2
              teclea "lee vacio.txt"
              sleep 1
              teclea "lee gigante.txt"
              sleep 1
              teclea "lee grande.txt"
              sleep 2
              teclea "lee"
              sleep 1
              teclea "lee bien.txt"
              sleep 1
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$disco.img,format=raw,if=ide \
              -serial file:$disco.txt -monitor stdio -no-reboot > /dev/null
            cat $disco.txt
            if grep -q "  X  " $disco.txt; then
              echo "El disco $disco ha tumbado a FalOS"
              exit 1
            fi
          done
          grep -q "archivo leido: 4096" malo.txt

      - name: Lo que ya tumbo a FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza larga"
            for orden in a b c d e f g h i j k l m n o p q r s t; do
              teclea "$orden"
            done
            sleep 1
            teclea "para 4"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:antes.txt -monitor stdio -no-reboot > /dev/null
          cat antes.txt
          if grep -q "  X  " antes.txt; then
            echo "Ha vuelto un fallo viejo"
            exit 1
          fi
          grep -q "larga cerrado con" antes.txt
          if grep -q "reiniciado" antes.txt; then
            echo "Un programa que solo gasta procesador ha tumbado un controlador"
            exit 1
          fi

      - name: Archivos del disco que mienten
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza gigante"
            teclea "lanza desborda"
            teclea "lanza fuera"
            teclea "lanza corto"
            teclea "lanza carta"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:mentiras.txt -monitor stdio -no-reboot > /dev/null
          cat mentiras.txt
          if grep -q "  X  " mentiras.txt; then
            echo "Un archivo ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "^rechazado: " mentiras.txt)" = 5
          grep -q "cuenta cerrado con" mentiras.txt

      - name: La pantalla se cuelga y vuelve
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            echo "screendump antes.ppm"
            sleep 1
            teclea "cuelga pantalla"
            sleep 3
            teclea "rompe pantalla"
            sleep 2
            teclea "ayuda"
            sleep 2
            echo "screendump despues.ppm"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:graficos.txt -monitor stdio -no-reboot > /dev/null
          cat graficos.txt
          if grep -q "  X  " graficos.txt; then
            echo "La pantalla ha tumbado a FalOS"
            exit 1
          fi
          grep -q "pantalla reiniciado, y van 2" graficos.txt
          grep -q "pantalla cerrado por la excepción 13" graficos.txt
          python3 - <<'FIN'
          for nombre in ("antes.ppm", "despues.ppm"):
              datos = open(nombre, "rb").read()
              cabecera = datos.split(b"\n", 3)
              assert cabecera[1] == b"960 600", cabecera[1]
              colores = {cabecera[3][i:i + 3] for i in range(0, len(cabecera[3]), 3)}
              assert len(colores) > 3, nombre
          FIN

      - name: Ventanas y raton
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza disfraz"
            teclea "lanza cuenta"
            teclea "lanza larga"
            sleep 3
            echo "screendump ventanas.ppm"
            sleep 1
            echo "mouse_move 354 -48"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 1
            echo "mouse_move 72 -192"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 2
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:ventanas.txt -monitor stdio -no-reboot > /dev/null
          cat ventanas.txt
          if grep -q "  X  " ventanas.txt; then
            echo "Las ventanas han tumbado a FalOS"
            exit 1
          fi
          grep -q "ratón listo" ventanas.txt
          grep -q "cuenta cerrado con" ventanas.txt
          grep -q "bucle cerrado con" ventanas.txt
          python3 - <<'FIN'
          datos = open("ventanas.ppm", "rb").read()
          cabecera = datos.split(b"\n", 3)
          pixeles = cabecera[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
              cuantos[p] = cuantos.get(p, 0) + 1
          for nombre, color in [("verde", (86, 211, 100)), ("amarillo", (227, 179, 65)),
                                ("lila", (210, 168, 255)), ("cian", (57, 197, 207))]:
              hay = cuantos.get(bytes(color), 0)
              print(nombre, hay)
              assert hay > 3000, nombre
          FIN

      - name: Un juego, y el teclado solo para quien tu digas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza disfraz"
            teclea "lanza serpiente"
            sleep 2
            teclea "secreto"
            sleep 1
            teclea "teclado 2"
            sleep 1
            echo "sendkey up"
            sleep 0.5
            echo "sendkey right"
            sleep 1
            echo "screendump juego.ppm"
            sleep 1
            echo "sendkey esc"
            sleep 0.5
            teclea "para 2"
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:juego.txt -monitor stdio -no-reboot > /dev/null
          cat juego.txt
          if grep -q "  X  " juego.txt; then
            echo "El juego ha tumbado a FalOS"
            exit 1
          fi
          grep -q "disfraz recibió 0 teclas" juego.txt
          grep -Eq "serpiente recibió [1-9]" juego.txt
          grep -q "serpiente cerrado con" juego.txt
          python3 - <<'FIN'
          datos = open("juego.ppm", "rb").read()
          pixeles = datos.split(b"\n", 3)[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
              cuantos[p] = cuantos.get(p, 0) + 1
          for nombre, color, minimo in [("la ventana", (227, 179, 65), 3000),
                                        ("la comida", (248, 113, 104), 500)]:
              hay = cuantos.get(bytes(color), 0)
              print(nombre, hay)
              assert hay > minimo, nombre
          FIN

      - name: Escribir en el disco sin pisar nada
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          lanza_veces() {
            {
              sleep 4
              teclea "lanza veces"
              sleep 2
              teclea "$3"
              sleep 2
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$1,format=raw,if=ide \
              -serial file:$2 -monitor stdio -no-reboot > /dev/null
            cat $2
            if grep -q "  X  " $2; then
              echo "Escribir en el disco ha tumbado a FalOS"
              exit 1
            fi
          }
          lanza_veces disco.img veces1.txt "deja 1"
          lanza_veces disco.img veces2.txt "deja 1"
          lanza_veces disco.img veces3.txt "niega 1"
          grep -q "veces leyó del disco: -3" veces1.txt
          grep -q "veces pide permiso para guardar" veces1.txt
          grep -q "veces guardó en el disco: 2" veces1.txt
          grep -q "veces leyó del disco: 2" veces2.txt
          grep -q "veces guardó en el disco: -10" veces3.txt
          python3 - <<'FIN'
          imagen = open("disco.img", "rb").read()
          lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
          sitio = {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}
          sector, medida = sitio[b"veces.dat"]
          assert imagen[sector * 512:sector * 512 + medida] == b"2\n"
          sector, medida = sitio[b"veces.prg"]
          programa = imagen[sector * 512:sector * 512 + medida]
          open("veces.prg", "wb").write(programa)
          huecos = (medida + 511) // 512

          def disco(nombre, lineas):
              indice = b"FALDISC2\n" + b"".join(lineas) + b"\n"
              assert len(indice) <= 1024
              datos = indice.ljust(1024, b" ") + programa.ljust(huecos * 512, b"\0") + bytes(512 * 64)
              open(nombre, "wb").write(datos)
              open(nombre + ".antes", "wb").write(datos)

          suyo = b"veces.prg 2 %d\n" % medida
          disco("pisa.img", [suyo, b"veces.dat 2 2\n"])
          disco("roto.img", [suyo, b"ra\x07ro.txt 2 5\n"])
          lleno = [suyo]
          mide = lambda: len(b"FALDISC2\n" + b"".join(lleno) + b"\n")
          while mide() < 985:
              lleno.append(b"relleno%02d.txt 2 5\n" % len(lleno))
          lleno.append(b"r" * (1010 - mide()) + b" 2 5\n")
          disco("lleno.img", lleno)
          FIN
          for disco in pisa roto lleno; do
            lanza_veces $disco.img $disco.txt "deja 1"
          done
          grep -q "veces guardó en el disco: 2" pisa.txt
          grep -q "veces guardó en el disco: -5" roto.txt
          grep -q "veces guardó en el disco: -7" lleno.txt
          cmp roto.img roto.img.antes
          cmp lleno.img lleno.img.antes
          python3 - <<'FIN'
          imagen = open("pisa.img", "rb").read()
          programa = open("veces.prg", "rb").read()
          assert imagen[1024:1024 + len(programa)] == programa
          lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
          sitio = {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}
          sector, medida = sitio[b"veces.dat"]
          assert sector != 2
          assert imagen[sector * 512:sector * 512 + medida] == b"1\n"
          FIN
          cp disco.img olvido.img
          lanza_veces olvido.img olvido.txt "olvida veces"
          grep -q "veces olvidado: 2" olvido.txt
          python3 - <<'FIN'
          antes = open("disco.img", "rb").read()
          despues = open("olvido.img", "rb").read()
          lineas = antes[:1024].split(b"\n\n")[0].split(b"\n")[1:]
          sitio = {l.split()[0]: int(l.split()[1]) for l in lineas}
          assert b"veces.dat" not in despues[:1024]
          sector = sitio[b"veces.dat"]
          assert despues[sector * 512:(sector + 1) * 512] == bytes(512)
          FIN

      - name: Notas cifradas y firmadas con tu contraseña
        run: |
          python3 -m venv /tmp/argon
          /tmp/argon/bin/pip install -q argon2-cffi
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          abre_notas() {
            {
              sleep 4
              echo "sendkey ret"
              sleep 1
              teclea "lanza notas"
              sleep 3
              teclea "teclado 1"
              sleep 1
              for clave in $3; do
                teclea "$clave"
                sleep 1
              done
              sleep 60
              teclea "$4"
              echo "sendkey end"
              sleep 3
              echo "sendkey esc"
              sleep 1
              teclea "deja 1"
              sleep 3
              echo quit
            } | timeout 150 qemu-system-x86_64 -cpu max -kernel sistema.bin -display none \
              -drive file=$1,format=raw,if=ide \
              -serial file:$2 -monitor stdio -no-reboot > /dev/null
            cat $2
            if grep -q "  X  " $2; then
              echo "Las notas han tumbado a FalOS"
              exit 1
            fi
          }
          cp disco.img notas.img
          abre_notas notas.img notas1.txt "gato gato" "kiwi azul"
          grep -q "notas leyó del disco: -3" notas1.txt
          grep -q "notas guardó en el disco: 90" notas1.txt
          abre_notas notas.img notas2.txt "perro gato" "otra"
          grep -q "notas leyó del disco: 90" notas2.txt
          grep -q "notas guardó en el disco: 95" notas2.txt
          cp notas.img tocada.img
          /tmp/argon/bin/python - <<'FIN'
          import hashlib, struct
          from argon2.low_level import hash_secret_raw, Type

          def gira(x, n):
              return ((x << n) | (x >> (32 - n))) & 0xffffffff

          def cuarto(s, a, b, c, d):
              s[a] = (s[a] + s[b]) & 0xffffffff; s[d] = gira(s[d] ^ s[a], 16)
              s[c] = (s[c] + s[d]) & 0xffffffff; s[b] = gira(s[b] ^ s[c], 12)
              s[a] = (s[a] + s[b]) & 0xffffffff; s[d] = gira(s[d] ^ s[a], 8)
              s[c] = (s[c] + s[d]) & 0xffffffff; s[b] = gira(s[b] ^ s[c], 7)

          def bloque(clave, contador, nonce):
              estado = [0x61707865, 0x3320646e, 0x79622d32, 0x6b206574] + list(struct.unpack("<8I", clave)) + [contador] + list(struct.unpack("<3I", nonce))
              s = list(estado)
              for _ in range(10):
                  cuarto(s, 0, 4, 8, 12); cuarto(s, 1, 5, 9, 13); cuarto(s, 2, 6, 10, 14); cuarto(s, 3, 7, 11, 15)
                  cuarto(s, 0, 5, 10, 15); cuarto(s, 1, 6, 11, 12); cuarto(s, 2, 7, 8, 13); cuarto(s, 3, 4, 9, 14)
              return struct.pack("<16I", *[(s[i] + estado[i]) & 0xffffffff for i in range(16)])

          rfc = bloque(bytes(range(32)), 1, bytes.fromhex("000000090000004a00000000"))
          assert rfc[:4] == bytes.fromhex("10f1e7e4")

          def claves_de(archivo, contrasena):
              return hash_secret_raw(contrasena, archivo[4:20], time_cost=3, memory_cost=2040,
                                     parallelism=1, hash_len=64, type=Type.ID)

          def abre(archivo, contrasena):
              assert archivo[:4] == b"NOT2"
              claves = claves_de(archivo, contrasena)
              firma = claves[32:]
              if hashlib.blake2b(b"comprobante", key=firma, digest_size=16).digest() != archivo[32:48]:
                  return None
              assert hashlib.blake2b(archivo[:-32], key=firma, digest_size=32).digest() == archivo[-32:]
              flujo = b"".join(bloque(claves[:32], c, archivo[20:32]) for c in range(1, 8))
              return bytes(a ^ b for a, b in zip(archivo[48:-32], flujo))

          def sitio_de(imagen, nombre):
              lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
              sitio = {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}
              sector, medida = sitio[nombre]
              return sector * 512, medida

          imagen = open("notas.img", "rb").read()
          desde, medida = sitio_de(imagen, b"notas.dat")
          archivo = imagen[desde:desde + medida]
          assert abre(archivo, b"gato") == b"kiwi azul\notra\n", abre(archivo, b"gato")
          assert abre(archivo, b"perro") is None
          assert b"kiwi" not in imagen and b"azul" not in imagen and b"gato" not in imagen
          tocada = bytearray(imagen)
          tocada[desde + 50] ^= 1
          open("tocada.img", "wb").write(tocada)
          FIN
          abre_notas tocada.img notas3.txt "gato" "no"
          grep -q "notas leyó del disco: 95" notas3.txt
          if grep -q "notas pide permiso\|notas guardó" notas3.txt; then
            echo "Ha abierto una nota que alguien habia tocado"
            exit 1
          fi

      - name: Un registro de quien toca tus cosas, y permisos para siempre
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          arranca() {
            imagen=$1
            salida=$2
            shift 2
            {
              sleep 4
              for orden in "$@"; do
                teclea "$orden"
                sleep 2
              done
              echo quit
            } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$imagen,format=raw,if=ide \
              -serial file:$salida -monitor stdio -no-reboot > /dev/null
            cat $salida
            if grep -q "  X  " $salida; then
              echo "El registro ha tumbado a FalOS"
              exit 1
            fi
          }
          cp disco.img siempre.img
          arranca siempre.img siempre1.txt "lanza veces" "deja siempre 1" "registro"
          grep -q "veces pide permiso para guardar" siempre1.txt
          grep -q "permisos.sis guardado: 6" siempre1.txt
          grep -q "veces apunte 7 0" siempre1.txt
          grep -q "FalOS apunte 14 6" siempre1.txt
          grep -q "veces apunte 4 2" siempre1.txt
          cp siempre.img basura.img
          arranca siempre.img siempre2.txt "lanza veces" "registro"
          grep -q "permisos.sis leido: 6" siempre2.txt
          if grep -q "pide permiso" siempre2.txt; then
            echo "Ha vuelto a preguntar despues de reiniciar"
            exit 1
          fi
          grep -q "veces guardó en el disco: 2" siempre2.txt
          grep -q "veces apunte 1 2" siempre2.txt
          arranca siempre.img siempre3.txt "niega veces" "lanza veces" "niega 1" "registro"
          grep -q "veces apunte 9 0" siempre3.txt
          grep -q "veces pide permiso para guardar" siempre3.txt
          grep -q "veces guardó en el disco: -10" siempre3.txt
          python3 - <<'FIN'
          def indice(nombre):
              imagen = open(nombre, "rb").read()
              lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
              return imagen, {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}

          imagen, sitio = indice("basura.img")
          sector, medida = sitio[b"permisos.sis"]
          assert imagen[sector * 512:sector * 512 + medida] == b"veces\n"
          for registrado in (b"dejaste", b"apunte", b"pidi\xc3\xb3 guardar"):
              assert registrado not in imagen
          despues, sitio_despues = indice("siempre.img")
          assert b"permisos.sis" not in sitio_despues
          assert despues[sector * 512:(sector + 1) * 512] == bytes(512)
          roto = bytearray(imagen)
          roto[sector * 512:sector * 512 + medida] = b"ve\x07ces"
          open("basura.img", "wb").write(roto)
          FIN
          arranca basura.img basura.txt "lanza veces"
          if grep -q "permisos.sis leido" basura.txt; then
            echo "Se ha creido una lista de permisos rota"
            exit 1
          fi
          grep -q "veces pide permiso para guardar" basura.txt

      - name: Pantalla con contraseña, y bloqueada los programas no ven nada
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          arranca() {
            imagen=$1
            salida=$2
            shift 2
            {
              sleep 4
              echo "sendkey ret"
              sleep 1
              for orden in "$@"; do
                case "$orden" in
                  espera) sleep 20 ;;
                  cinco_minutos) sleep 320 ;;
                  *) teclea "$orden"; sleep 2 ;;
                esac
              done
              echo quit
            } | timeout 600 qemu-system-x86_64 -cpu max -kernel sistema.bin -display none \
              -drive file=$imagen,format=raw,if=ide \
              -serial file:$salida -monitor stdio -no-reboot > /dev/null
            cat $salida
            if grep -q "  X  " $salida; then
              echo "El cerrojo ha tumbado a FalOS"
              exit 1
            fi
          }
          cp disco.img cerrojo.img
          arranca cerrojo.img cerrojo1.txt "cerrojo" "gato" "gato" espera "bloquea" "registro" espera
          grep -q "cerrojo.sis guardado: 52" cerrojo1.txt
          cp cerrojo.img recien.img
          arranca cerrojo.img cerrojo2.txt "lanza veces" espera "gato" espera "registro" "lanza veces"
          grep -q "cerrojo.sis leido: 52" cerrojo2.txt
          grep -q "FalOS apunte 19 0" cerrojo2.txt
          grep -q "FalOS apunte 18 0" cerrojo2.txt
          test "$(grep -c "veces pide permiso para guardar" cerrojo2.txt)" = 1
          if grep -q "veces apunte" cerrojo2.txt; then
            echo "veces ha corrido con la pantalla bloqueada"
            exit 1
          fi
          arranca cerrojo.img cerrojo3.txt "gato" espera "lanza veces" "teclado 1" cinco_minutos "deja 1" espera "gato" espera "registro"
          grep -q "FalOS apunte 17 0" cerrojo3.txt
          grep -q "FalOS apunte 19 0" cerrojo3.txt
          if grep -q "veces guardó" cerrojo3.txt; then
            echo "Una orden escrita con la pantalla bloqueada ha llegado a la consola"
            exit 1
          fi
          arranca cerrojo.img cerrojo4.txt "gato" espera "sin cerrojo"
          grep -q "cerrojo.sis olvidado: 52" cerrojo4.txt
          arranca cerrojo.img cerrojo5.txt "registro"
          if grep -q "cerrojo.sis leido" cerrojo5.txt; then
            echo "Sigue pidiendo contraseña despues de quitarla"
            exit 1
          fi
          /tmp/argon/bin/python - <<'FIN'
          from argon2.low_level import hash_secret_raw, Type

          def indice(nombre):
              imagen = open(nombre, "rb").read()
              lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
              return imagen, {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}

          imagen, sitio = indice("recien.img")
          sector, medida = sitio[b"cerrojo.sis"]
          cerrojo = imagen[sector * 512:sector * 512 + medida]
          assert cerrojo[:4] == b"CER1" and len(cerrojo) == 52
          huella = hash_secret_raw(b"gato", cerrojo[4:20], time_cost=3, memory_cost=2040,
                                   parallelism=1, hash_len=32, type=Type.ID)
          assert huella == cerrojo[20:], (huella.hex(), cerrojo[20:].hex())
          assert b"gato" not in imagen
          despues, sitio_despues = indice("cerrojo.img")
          assert b"cerrojo.sis" not in sitio_despues
          assert despues[sector * 512:(sector + 1) * 512] == bytes(512)
          FIN
