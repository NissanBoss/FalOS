name: Arranca

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrancar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar Fal
        run: |
          git clone --depth 1 https://github.com/NissanBoss/Fal.git /tmp/fal
          cd /tmp/fal && go build -o /usr/local/bin/fal .

      - name: Instalar QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86

      - name: Compilar FalOS y su disco
        run: |
          fal --nucleo sistema.fal 2> avisos.txt
          fal haz_disco.fal 2>> avisos.txt
          cat avisos.txt
          if grep -q "^  !" avisos.txt; then
            echo "Una variable pisa una constante"
            exit 1
          fi

      - name: Arrancar
        run: |
          timeout 20 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:serie.txt -no-reboot || true
          cat serie.txt
          if grep -Eq "X  [A-Z]" serie.txt; then
            echo "FalOS revento al arrancar"
            exit 1
          fi
          grep -q "pantalla lista" serie.txt

      - name: Programas que intentan lo que no deben
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza apaga"
            sleep 4
            teclea "lanza espia"
            sleep 4
            teclea "lanza apaga"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:programas.txt -monitor stdio -no-reboot > /dev/null
          cat programas.txt
          if grep -Eq "X  [A-Z]" programas.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "apaga cerrado por la excepción 13" programas.txt)" = 2
          grep -q "espia cerrado por la excepción 14" programas.txt

      - name: El núcleo no está en las tablas de los programas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            sleep 2
            teclea "tablas 1"
            teclea "tablas 10"
            sleep 1
            teclea "lanza espia"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:tablas.txt -monitor stdio -no-reboot > /dev/null
          cat tablas.txt
          if grep -Eq "X  [A-Z]" tablas.txt; then
            echo "Cambiar de tablas ha tumbado a FalOS"
            exit 1
          fi
          grep -q "espia no tiene el núcleo en sus tablas" tablas.txt
          grep -q "espia cerrado por la excepción 14" tablas.txt
          for quien in bucle consola; do
            linea=$(grep "$quien tablas: " tablas.txt)
            nucleo=$(echo "$linea" | sed 's/.* suyas, \([0-9]*\) del núcleo.*/\1/')
            antes=$(echo "$linea" | sed 's/.*antes \([0-9]*\).*/\1/')
            echo "$quien ve $nucleo páginas del núcleo; antes, $antes"
            test "$nucleo" -gt 0
            test "$nucleo" -lt 16
            test "$antes" -gt 100000
          done

      - name: Un aparato no lee la memoria del núcleo
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          for maquina in con sin; do
            iommu=""
            if [ "$maquina" = con ]; then
              iommu="-device intel-iommu"
            fi
            {
              sleep 6
              teclea "dma"
              sleep 6
              echo quit
            } | timeout 40 qemu-system-x86_64 -machine q35 $iommu -device edu -kernel sistema.bin -display none               -serial file:dma_$maquina.txt -monitor stdio -no-reboot > /dev/null
            cat dma_$maquina.txt
            if grep -Eq "X  [A-Z]" dma_$maquina.txt; then
              echo "La prueba del IOMMU ha tumbado a FalOS"
              exit 1
            fi
          done
          grep -q "iommu: encendido" dma_con.txt
          grep -q "dma: copia bien, lee bloqueado, escribe bloqueado, faltas 2" dma_con.txt
          grep -q "dma: copia bien, lee el núcleo, escribe en lo ajeno" dma_sin.txt

      - name: Un teclado USB con su caja, y uno recién enchufado no escribe sin el código
        run: |
          cat > usb.py <<'FIN'
          import os, re, subprocess, sys, time

          CON = ["-device", "intel-iommu,intremap=on"]
          USB = ["-device", "qemu-xhci,id=x", "-device", "usb-kbd,id=uno"]
          LETRERO = "USB nuevo: teclea en él ".encode("cp437")

          class Ordenador:
              def __init__(self, nombre, *opciones):
                  self.serie = nombre + ".txt"
                  self.volcado = nombre + ".mem"
                  if os.path.exists(self.serie):
                      os.remove(self.serie)
                  self.qemu = subprocess.Popen(
                      ["qemu-system-x86_64", *opciones, "-kernel", "sistema.bin", "-display", "none",
                       "-serial", "file:" + self.serie, "-monitor", "stdio", "-no-reboot"],
                      stdin=subprocess.PIPE, stdout=subprocess.DEVNULL)

              def pide(self, orden, pausa):
                  self.qemu.stdin.write((orden + "\n").encode())
                  self.qemu.stdin.flush()
                  time.sleep(pausa)

              def teclea(self, texto, intro=True):
                  for letra in texto:
                      self.pide("sendkey " + {" ": "spc"}.get(letra, letra), 0.15)
                  if intro:
                      self.pide("sendkey ret", 0.15)

              def dicho(self):
                  if not os.path.exists(self.serie):
                      return ""
                  with open(self.serie, encoding="utf-8", errors="replace") as serie:
                      return serie.read()

              def espera(self, frase, veces=1):
                  hasta = time.time() + 40
                  while time.time() < hasta:
                      if self.dicho().count(frase) >= veces:
                          return
                      time.sleep(0.3)
                  self.falla("no dice " + frase)

              def falla(self, por_que):
                  print(self.dicho())
                  self.qemu.kill()
                  sys.exit(por_que)

              def codigo(self, viejo):
                  casillas = b"".join(re.escape(bytes([letra])) + b"." for letra in LETRERO)
                  for intento in range(20):
                      self.pide("pmemsave 0 134217728 " + self.volcado, 2)
                      with open(self.volcado, "rb") as memoria:
                          visto = re.search(casillas + b".".join([b"([0-9])"] * 6), memoria.read(), re.DOTALL)
                      if visto and b"".join(visto.groups()).decode() != viejo:
                          return b"".join(visto.groups()).decode()
                  self.falla("no sale el código")

              def apaga(self):
                  print(self.dicho())
                  if re.search("X  [A-Z]", self.dicho()):
                      self.falla("el USB ha tumbado a FalOS")
                  self.pide("quit", 0.5)
                  self.qemu.wait(20)

          falos = Ordenador("usb_con", "-machine", "q35,i8042=off", *CON, *USB)
          falos.espera("pantalla lista")
          falos.espera("ningún aparato puede fingir interrupciones")
          time.sleep(4)
          falos.teclea("dma")
          falos.espera("dma: no hay")

          falos.pide("device_add usb-kbd,id=dos", 2)
          falos.pide("device_del uno", 2)
          falos.espera("pide código")
          falos.teclea("dma")
          time.sleep(3)
          if falos.dicho().count("dma: no hay") != 1:
              falos.falla("un teclado recién enchufado ha escrito sin el código")
          codigo = falos.codigo("")
          falos.teclea(codigo, False)
          time.sleep(1)
          falos.teclea("dma")
          falos.espera("dma: no hay", 2)

          falos.teclea("rompe usb")
          falos.espera("usb: DMA parado por el IOMMU en 1048576")
          falos.espera("usb reiniciado, y van 1")
          falos.espera("pide código", 2)
          codigo = falos.codigo(codigo)
          falos.teclea(codigo, False)
          time.sleep(1)
          falos.teclea("dma")
          falos.espera("dma: no hay", 3)

          falos.teclea("cuelga usb")
          falos.espera("usb reiniciado, y van 2")
          falos.espera("pide código", 3)
          for veces in (4, 5, 5):
              malo = "000000"
              if falos.codigo(codigo) == malo:
                  malo = "111111"
              codigo = malo
              falos.teclea(malo, False)
              falos.espera("pide código", veces)
              time.sleep(1)
          falos.teclea("dma")
          time.sleep(3)
          if falos.dicho().count("dma: no hay") != 3:
              falos.falla("un teclado que ha fallado el código tres veces ha escrito")
          falos.apaga()

          falos = Ordenador("usb_sin", "-machine", "q35", "-device", "qemu-xhci")
          falos.espera("pantalla lista")
          time.sleep(3)
          falos.teclea("usb")
          falos.espera("usb: apagado, motivo 1")
          falos.apaga()

          falos = Ordenador("usb_pedido", "-machine", "q35", *CON, "-device", "qemu-xhci", "-append", "sin_iommu")
          falos.espera("pantalla lista")
          falos.espera("iommu: no, motivo 6")
          falos.espera("usb: 1")
          falos.apaga()
          FIN
          python3 usb.py

      - name: Permisos que se dan y se quitan
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza caja"
            teclea "lanza curioso"
            teclea "lanza ladron"
            sleep 2
            teclea "permite 2 1"
            sleep 3
            teclea "prohibe 2 1"
            sleep 1
            teclea "para 3"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:permisos.txt -monitor stdio -no-reboot > /dev/null
          cat permisos.txt
          if grep -Eq "X  [A-Z]" permisos.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          grep -Eq "curioso pierde el permiso tras [1-9]" permisos.txt
          grep -Eq "ladron cerrado con 0 preguntas y [1-9]" permisos.txt

      - name: El teclado y el disco se cuelgan y vuelven
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga teclado"
            sleep 3
            teclea "lanza apaga"
            sleep 2
            teclea "rompe teclado"
            sleep 2
            teclea "cuelga disco"
            sleep 3
            teclea "rompe disco"
            sleep 2
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza fisgon"
            sleep 3
            teclea "lanza impostor"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 80 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:aparatos.txt -monitor stdio -no-reboot > /dev/null
          cat aparatos.txt
          if grep -Eq "X  [A-Z]" aparatos.txt; then
            echo "Un aparato ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -Ec "archivo leido: [1-9]" aparatos.txt)" = 2
          grep -q "teclado reiniciado, y van 2" aparatos.txt
          grep -q "disco reiniciado, y van 2" aparatos.txt
          grep -q "apaga cerrado por la excepción 13" aparatos.txt
          grep -q "fisgon cerrado por la excepción 13" aparatos.txt
          grep -Eq "impostor cerrado con 0 preguntas y [1-9]" aparatos.txt

      - name: Discos hechos para romperlo
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          python3 - <<'FIN'
          sector = 512
          indice = (b"FALDISC2\n"
                    b"bien.txt 2 11\n"
                    b"vacio.txt 2 0\n"
                    b"lejos.txt 99999999 10\n"
                    b"gigante.txt 2 999999999999999999999999999\n"
                    b"negativo.txt -5 10\n"
                    b"nombre_de_mas_de_treinta_y_dos_letras_seguidas.txt 2 5\n"
                    b"ra\x07ro.txt 2 5\n"
                    b"grande.txt 2 31744\n")
          open("malo.img", "wb").write(indice.ljust(sector * 2, b" ") + b"hola, malo\n".ljust(sector * 62, b"x"))
          open("sin_salto.img", "wb").write(b"FALDISC2\n" + b"a" * (sector * 32 - 9))
          open("ruido.img", "wb").write(bytes(range(256)) * 128)
          FIN
          for disco in malo sin_salto ruido; do
            {
              sleep 4
              teclea "disco"
              sleep 2
              teclea "lee vacio.txt"
              sleep 1
              teclea "lee gigante.txt"
              sleep 1
              teclea "lee grande.txt"
              sleep 2
              teclea "lee"
              sleep 1
              teclea "lee bien.txt"
              sleep 1
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$disco.img,format=raw,if=ide \
              -serial file:$disco.txt -monitor stdio -no-reboot > /dev/null
            cat $disco.txt
            if grep -Eq "X  [A-Z]" $disco.txt; then
              echo "El disco $disco ha tumbado a FalOS"
              exit 1
            fi
          done
          grep -q "archivo leido: 4096" malo.txt

      - name: Lo que ya tumbo a FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza larga"
            for orden in a b c d e f g h i j k l m n o p q r s t; do
              teclea "$orden"
            done
            sleep 1
            teclea "para 4"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:antes.txt -monitor stdio -no-reboot > /dev/null
          cat antes.txt
          if grep -Eq "X  [A-Z]" antes.txt; then
            echo "Ha vuelto un fallo viejo"
            exit 1
          fi
          grep -q "larga cerrado con" antes.txt
          if grep -q "reiniciado" antes.txt; then
            echo "Un programa que solo gasta procesador ha tumbado un controlador"
            exit 1
          fi

      - name: Una sola llamada que tumbaba FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza tumba"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:tumba.txt -monitor stdio -no-reboot > /dev/null
          cat tumba.txt
          if grep -Eq "X  [A-Z]" tumba.txt; then
            echo "Guardar, leer o conectar desde el final de la memoria ha vuelto a tumbar a FalOS"
            exit 1
          fi
          grep -q "tumba recibió 0 teclas" tumba.txt
          if grep -q "tumba cerrado por" tumba.txt; then
            echo "tumba no ha llegado al final"
            exit 1
          fi
          grep -q "cuenta cerrado con" tumba.txt
          if grep -q "no hay controlador PS/2" tumba.txt; then
            echo "FalOS dice que no hay teclado con el teclado delante"
            exit 1
          fi

      - name: La consola es un programa, y si se rompe o se cuelga FalOS sigue
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "rompe consola"
            sleep 3
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga consola"
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "para 10"
            sleep 3
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza mandon"
            sleep 4
            teclea "para 1"
            sleep 2
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:consola.txt -monitor stdio -no-reboot > /dev/null
          cat consola.txt
          if grep -Eq "X  [A-Z]" consola.txt; then
            echo "Romper la consola ha tumbado a FalOS"
            exit 1
          fi
          grep -q "consola cerrado por la excepción 13" consola.txt
          grep -q "consola reiniciado, y van 1" consola.txt
          grep -q "consola reiniciado, y van 2" consola.txt
          grep -q "consola cerrado con 0 preguntas" consola.txt
          grep -q "consola reiniciado, y van 3" consola.txt
          test "$(grep -c "archivo leido: " consola.txt)" = 3
          grep -q "mandon cerrado con 0 preguntas y 3 rechazadas" consola.txt
          if grep -q "modo invitado\|permisos.sis guardado" consola.txt; then
            echo "Un programa ha dado órdenes como si fuera la consola"
            exit 1
          fi

      - name: Ninguna ventana tapa una pregunta de permiso
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza trampa"
            sleep 1
            teclea "teclado 1"
            teclea "x"
            sleep 2
            echo "screendump preguntando.ppm"
            sleep 1
            teclea "niega 1"
            sleep 2
            echo "screendump contestado.ppm"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide -nic user,model=ne2k_pci \
            -serial file:trampa.txt -monitor stdio -no-reboot > /dev/null
          cat trampa.txt
          if grep -Eq "X  [A-Z]" trampa.txt; then
            echo "La trampa ha tumbado a FalOS"
            exit 1
          fi
          grep -q "trampa pide permiso para conectarse" trampa.txt
          grep -q "trampa habló con la red: -10" trampa.txt
          python3 - <<'FIN'
          for nombre, ventana in (("preguntando.ppm", False), ("contestado.ppm", True)):
              pixeles = open(nombre, "rb").read().split(b"\n", 3)[3]
              verde = sum(1 for i in range(0, len(pixeles), 3) if pixeles[i:i + 3] == bytes((86, 211, 100)))
              print(nombre, verde)
              assert (verde > 3000) == ventana, nombre
          FIN

      - name: Un ordenador sin teclado PS/2
        run: |
          {
            sleep 6
            echo quit
          } | timeout 30 qemu-system-x86_64 -machine q35,i8042=off -kernel sistema.bin -display none \
            -serial file:sin_teclado.txt -monitor stdio -no-reboot > /dev/null
          cat sin_teclado.txt
          if grep -Eq "X  [A-Z]" sin_teclado.txt; then
            echo "Arrancar sin controlador de teclado ha tumbado a FalOS"
            exit 1
          fi
          grep -q "teclado: no hay controlador PS/2" sin_teclado.txt
          grep -q "pantalla lista" sin_teclado.txt

      - name: Archivos del disco que mienten
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza gigante"
            teclea "lanza desborda"
            teclea "lanza fuera"
            teclea "lanza corto"
            teclea "lanza carta"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:mentiras.txt -monitor stdio -no-reboot > /dev/null
          cat mentiras.txt
          if grep -Eq "X  [A-Z]" mentiras.txt; then
            echo "Un archivo ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "^rechazado: " mentiras.txt)" = 5
          grep -q "cuenta cerrado con" mentiras.txt

      - name: Dos archivos con el mismo nombre
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          cp programas/cuenta.fal disco/serpiente.prg
          if fal haz_disco.fal; then
            echo "haz_disco ha metido dos serpiente.prg"
            exit 1
          fi
          rm disco/serpiente.prg
          printf 'escribe "hola"\n' > "programas/Mal.fal"
          if fal haz_disco.fal; then
            echo "haz_disco ha metido un nombre con mayúsculas"
            exit 1
          fi
          rm programas/Mal.fal
          fal haz_disco.fal > /dev/null
          python3 - <<'FIN'
          imagen = open("disco.img", "rb").read()
