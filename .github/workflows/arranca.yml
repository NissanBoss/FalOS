                  self.mentiras, self.buena, self.ruido, self.vistas = mentiras, buena, ruido, []
                  self.start()

              def opciones(self):
                  puerto = self.enchufe.getsockname()[1]
                  return ["-netdev", "socket,id=n1,udp=127.0.0.1:%d,localaddr=127.0.0.1:%d" % (puerto, self.el_otro), *TARJETA]

              def lanza(self, trama):
                  self.enchufe.sendto(trama, ("127.0.0.1", self.el_otro))

              def por_ip(self, para, de, a, lleva, cuerpo):
                  cabeza = struct.pack("!BBHHHBBH4s4s", 69, 0, 20 + len(cuerpo), 1, 0, 64, lleva, 0, de, a)
                  cabeza = cabeza[:10] + struct.pack("!H", 65535 - suma(cabeza)) + cabeza[12:]
                  return para + self.SU_MAC + b"\x08\x00" + cabeza + cuerpo

              def por_udp(self, para, de, a, puertos, datos, largo=None):
                  cabeza = struct.pack("!HHHH", *puertos, 8 + len(datos) if largo is None else largo, 0)
                  return self.por_ip(para, de, a, 17, cabeza + datos)

              def oferta(self, pregunta, tipo, cambia=None):
                  c = {"op": 2, "xid": pregunta[46:50], "quien": pregunta[70:76], "da": self.AQUI, "galleta": GALLETA,
                       "mascara": ip("255.255.255.0"), "salida": self.SALIDA, "dns": self.DNS, "servidor": self.SALIDA,
                       "dura": struct.pack("!I", 3600), "tipo": bytes([tipo]), "cola": b"\xff", "delante": b"",
