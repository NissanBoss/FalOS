          import hashlib, struct

          def gira(x, n):
              return ((x << n) | (x >> (32 - n))) & 0xffffffff

          def cuarto(s, a, b, c, d):
              s[a] = (s[a] + s[b]) & 0xffffffff; s[d] = gira(s[d] ^ s[a], 16)
              s[c] = (s[c] + s[d]) & 0xffffffff; s[b] = gira(s[b] ^ s[c], 12)
              s[a] = (s[a] + s[b]) & 0xffffffff; s[d] = gira(s[d] ^ s[a], 8)
              s[c] = (s[c] + s[d]) & 0xffffffff; s[b] = gira(s[b] ^ s[c], 7)

          def bloque(clave, contador, nonce):
              estado = [0x61707865, 0x3320646e, 0x79622d32, 0x6b206574] + list(struct.unpack("<8I", clave)) + [contador] + list(struct.unpack("<3I", nonce))
              s = list(estado)
              for _ in range(10):
                  cuarto(s, 0, 4, 8, 12); cuarto(s, 1, 5, 9, 13); cuarto(s, 2, 6, 10, 14); cuarto(s, 3, 7, 11, 15)
                  cuarto(s, 0, 5, 10, 15); cuarto(s, 1, 6, 11, 12); cuarto(s, 2, 7, 8, 13); cuarto(s, 3, 4, 9, 14)
              return struct.pack("<16I", *[(s[i] + estado[i]) & 0xffffffff for i in range(16)])

          def indice(imagen):
              lineas = imagen[:1024].split(b"\n\n")[0].split(b"\n")[1:]
              return {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}

          def archivo(imagen, nombre):
              sector, medida = indice(imagen)[nombre]
              return imagen[sector * 512:sector * 512 + medida]

          def llave_de(imagen):
              sis = archivo(imagen, b"llave.sis")
              assert sis[:4] == b"LLA1" and len(sis) == 36
              return sis[4:]

          def descifra(cifrado, llave, programa):
              assert cifrado[:4] == b"FAL1" and len(cifrado) >= 48
              claves = hashlib.blake2b(b"guardado:" + programa, key=llave, digest_size=64).digest()
              if hashlib.blake2b(cifrado[:-32], key=claves[32:], digest_size=32).digest() != cifrado[-32:]:
                  return None
              flujo = b"".join(bloque(claves[:32], c, cifrado[4:16]) for c in range(1, 9))
              return bytes(a ^ b for a, b in zip(cifrado[16:-32], flujo))

          def abre(imagen, programa, llave=None):
              return descifra(archivo(imagen, programa + b".dat"), llave or llave_de(imagen), programa)
