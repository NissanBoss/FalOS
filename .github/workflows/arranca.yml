      - name: Lo que guardan los programas va cifrado, y el invitado no deja rastro
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          arranca() {
            imagen=$1
            salida=$2
            shift 2
            {
              sleep 5
              for orden in "$@"; do
                case "$orden" in
                  espera) sleep 20 ;;
                  intro) echo "sendkey ret"; sleep 2 ;;
                  *) teclea "$orden"; sleep 3 ;;
                esac
              done
              echo quit
            } | timeout 300 qemu-system-x86_64 -cpu max -kernel sistema.bin -display none \
              -drive file=$imagen,format=raw,if=ide \
              -serial file:$salida -monitor stdio -no-reboot > /dev/null
            cat $salida
            if grep -Eq "X  [A-Z]" $salida; then
              echo "Cifrar lo guardado ha tumbado a FalOS"
              exit 1
            fi
          }
          fal haz_disco.fal > /dev/null
          cp disco.img cifra.img
          arranca cifra.img cifra1.txt "lanza veces" "deja 1"
          arranca cifra.img cifra2.txt "lanza veces" "deja 1"
          grep -q "llave.sis guardado: 36" cifra1.txt
          grep -q "azar: del procesador" cifra1.txt
          grep -q "veces guardó en el disco: 2" cifra1.txt
          grep -q "llave.sis leido: 36" cifra2.txt
          grep -q "veces leyó del disco: 2" cifra2.txt
          python3 - <<'FIN'
          import guardado
          imagen = open("cifra.img", "rb").read()
          llave = guardado.llave_de(imagen)
          cifrado = guardado.archivo(imagen, b"veces.dat")
          assert len(cifrado) == 2 + 48
          assert guardado.abre(imagen, b"veces") == b"2\n"
          assert guardado.descifra(cifrado, llave, b"serpiente") is None
          sector = guardado.indice(imagen)[b"veces.dat"][0]
          tocada = bytearray(imagen)
          tocada[sector * 512 + 20] ^= 1
          open("tocada14.img", "wb").write(tocada)
          medida = guardado.indice(imagen)[b"veces.dat"][1]
          indice = imagen[:1024].replace(b"veces.dat %d %d\n" % (sector, medida), b"veces.dat %d 2\n" % sector)
          claro = bytearray(indice.ljust(1024, b" ")[:1024] + imagen[1024:])
          claro[sector * 512:sector * 512 + 2] = b"7\n"
          open("claro14.img", "wb").write(claro)
          FIN
          arranca tocada14.img tocada14.txt "lanza veces" "registro"
          grep -q "veces leyó del disco: -13" tocada14.txt
          grep -q "veces apunte 26 0" tocada14.txt
          arranca claro14.img claro14.txt "lanza veces" "registro"
          grep -q "veces leyó del disco: -14" claro14.txt
          grep -q "veces apunte 27 0" claro14.txt
          cp cifra.img invitado.img
          arranca invitado.img invitado1.txt "invitado" "lanza veces" "deja siempre 1" "para 1" "lanza veces" "deja 1" "para 1" "olvida veces" "cerrojo" "registro"
          cmp invitado.img cifra.img
          grep -q "modo invitado" invitado1.txt
          grep -q "FalOS apunte 25 0" invitado1.txt
          grep -q "veces leyó de la memoria: -3" invitado1.txt
          grep -q "veces guardó en la memoria: 2" invitado1.txt
          grep -q "veces leyó de la memoria: 2" invitado1.txt
          grep -q "veces olvidado: 2" invitado1.txt
          if grep -q "en el disco\|guardado: \|olvidado: 50" invitado1.txt; then
            echo "El invitado ha escrito en el disco"
            exit 1
          fi
          cp cifra.img llave.img
          arranca llave.img llave1.txt "cerrojo" "gato" "gato" espera "lanza veces" "deja 1"
          grep -q "cerrojo.sis guardado: 84" llave1.txt
          grep -q "llave.sis olvidado: 36" llave1.txt
          grep -q "veces guardó en el disco: 2" llave1.txt
          /tmp/argon/bin/python - <<'FIN'
          import guardado
          from argon2.low_level import hash_secret_raw, Type
          antes = open("cifra.img", "rb").read()
          imagen = open("llave.img", "rb").read()
          assert b"llave.sis" not in guardado.indice(imagen)
          sector = guardado.indice(antes)[b"llave.sis"][0]
          assert imagen[sector * 512:(sector + 1) * 512] == bytes(512)
          cerrojo = guardado.archivo(imagen, b"cerrojo.sis")
          assert cerrojo[:4] == b"CER2" and len(cerrojo) == 84
          salida = hash_secret_raw(b"gato", cerrojo[4:20], time_cost=3, memory_cost=2040,
                                   parallelism=1, hash_len=64, type=Type.ID)
          assert salida[:32] == cerrojo[20:52]
          llave = bytes(a ^ b for a, b in zip(cerrojo[52:], salida[32:]))
          assert llave == guardado.llave_de(antes)
          assert guardado.abre(imagen, b"veces", llave) == b"3\n"
          assert llave not in imagen and b"gato" not in imagen
          FIN
          cp llave.img bloqueado.img
          arranca bloqueado.img bloqueado.txt intro "lanza veces" "deja 1" "sin cerrojo" "lee cerrojo.sis" "lee llave.sis" "registro"
          cmp bloqueado.img llave.img
          grep -q "modo invitado" bloqueado.txt
          grep -q "veces leyó de la memoria: -3" bloqueado.txt
          if grep -q "archivo leido: " bloqueado.txt; then
            echo "El invitado ha leído un .sis"
            exit 1
          fi
          arranca llave.img llave2.txt "gato" espera "lanza veces" "deja 1"
          grep -q "veces leyó del disco: 2" llave2.txt
          grep -q "veces guardó en el disco: 2" llave2.txt
          /tmp/argon/bin/python - <<'FIN'
          import guardado
          from argon2.low_level import hash_secret_raw, Type
          imagen = open("llave.img", "rb").read()
          cerrojo = guardado.archivo(imagen, b"cerrojo.sis")
          salida = hash_secret_raw(b"gato", cerrojo[4:20], time_cost=3, memory_cost=2040,
                                   parallelism=1, hash_len=64, type=Type.ID)
          llave = bytes(a ^ b for a, b in zip(cerrojo[52:], salida[32:]))
          assert guardado.abre(imagen, b"veces", llave) == b"4\n"
          FIN

      - name: La red, y que nada salga sin que lo pidas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          arranca() {
            tarjeta=$1
            salida=$2
            shift 2
            cp disco.img red.img
            {
              sleep 5
              for orden in "$@"; do
                case "$orden" in
                  espera) sleep 20 ;;
                  *) teclea "$orden"; sleep 3 ;;
                esac
              done
              echo quit
            } | timeout 300 qemu-system-x86_64 -cpu max -kernel sistema.bin -display none \
              -drive file=red.img,format=raw,if=ide $tarjeta \
              -serial file:$salida -monitor stdio -no-reboot > /dev/null
            cat $salida
            if grep -Eq "X  [A-Z]" $salida; then
              echo "La red ha tumbado a FalOS"
              exit 1
            fi
          }
          con_red() {
            echo "-netdev user,id=n1 -device ne2k_pci,netdev=n1 -object filter-dump,id=f1,netdev=n1,file=$1"
          }
          fal haz_disco.fal > /dev/null
          arranca "$(con_red callada.pcap)" callada.txt "lanza escucha" espera "lanza fisgon" "lanza veces" "red" "cuelga red" espera "rompe red" espera "tareas"
          grep -q "red: NE2000 en el puerto" callada.txt
          grep -q "escucha cerrado por la excepción 13" callada.txt
          grep -q "red: enviadas 0" callada.txt
          grep -q "red reiniciado, y van 2" callada.txt
          arranca "$(con_red ping.pcap)" ping.txt "cuelga red" espera "ping" espera "ping 10.0.2.99" espera "ping 10.0.2" "red" "registro"
          grep -q "red reiniciado, y van 1" ping.txt
          grep -q "ping: 10.0.2.2 contesta 4" ping.txt
          grep -q "ping: nadie contesta" ping.txt
          grep -q "red: enviadas 8" ping.txt
          grep -q "10.0.2.2 apunte 30 4" ping.txt
          grep -q "10.0.2.99 apunte 30 0" ping.txt
          arranca "-nic none" sin_red.txt "ping" "red" "tareas"
          grep -q "red: no hay tarjeta" sin_red.txt
          if grep -q "red: NE2000\|red: tarjeta en marcha" sin_red.txt; then
            echo "FalOS ve una tarjeta que no existe"
            exit 1
          fi
          python3 - <<'FIN'
          import struct

          FALOS = bytes.fromhex("525400123456")

          def tramas(nombre):
              datos = open(nombre, "rb").read()
              i = 24
              while i < len(datos):
                  cap = struct.unpack("<I", datos[i + 8:i + 12])[0]
                  yield datos[i + 16:i + 16 + cap]
                  i += 16 + cap

          def suma(trozo):
              if len(trozo) % 2:
                  trozo += b"\0"
              total = sum(struct.unpack("!%dH" % (len(trozo) // 2), trozo))
              while total >> 16:
                  total = (total & 0xFFFF) + (total >> 16)
              return total

          callada = [t for t in tramas("callada.pcap") if t[6:12] == FALOS]
          assert callada == [], "FalOS ha sacado %d tramas sin que nadie hiciera ping" % len(callada)

          salen = [t for t in tramas("ping.pcap") if t[6:12] == FALOS]
          entran = [t for t in tramas("ping.pcap") if t[0:6] == FALOS]
          arp = [t for t in salen if t[12:14] == b"\x08\x06"]
          eco = [t for t in salen if t[12:14] == b"\x08\x00"]
          assert len(salen) == 8 and len(arp) == 4 and len(eco) == 4, len(salen)
          assert [bytes(t[38:42]) for t in arp] == [bytes([10, 0, 2, 2])] + [bytes([10, 0, 2, 99])] * 3
          for numero, t in enumerate(eco, 1):
              ip = t[14:34]
              assert ip[9] == 1 and ip[12:16] == bytes([10, 0, 2, 15]) and ip[16:20] == bytes([10, 0, 2, 2])
              assert suma(ip) == 0xFFFF
              largo = struct.unpack("!H", ip[2:4])[0]
              icmp = t[34:14 + largo]
              assert icmp[0] == 8 and suma(icmp) == 0xFFFF
              assert struct.unpack("!H", icmp[6:8])[0] == numero
              assert icmp[8:] == b"FalOS: solo sale si tu lo pides."
          respuestas = [t for t in entran if t[12:14] == b"\x08\x00" and t[34] == 0]
          assert len(respuestas) == 4
          FIN

      - name: Un programa solo sale a la red si le dejas, y solo a donde le dejas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          fal haz_disco.fal > /dev/null
          cp disco.img conecta.img
          {
            sleep 5
            for orden in "lanza busca" "deja 1" espera "lanza chivato" "niega 2" espera "niega 2" "registro" "tareas"; do
              case "$orden" in
                espera) sleep 20 ;;
                *) teclea "$orden"; sleep 3 ;;
              esac
            done
            echo quit
          } | timeout 300 qemu-system-x86_64 -cpu max -kernel sistema.bin -display none \
            -drive file=conecta.img,format=raw,if=ide \
            -netdev user,id=n1 -device ne2k_pci,netdev=n1 -object filter-dump,id=f1,netdev=n1,file=conecta.pcap \
            -serial file:conecta.txt -monitor stdio -no-reboot > /dev/null
          cat conecta.txt
          if grep -Eq "X  [A-Z]" conecta.txt; then
            echo "La red de los programas ha tumbado a FalOS"
            exit 1
          fi
          grep -q "busca pide permiso para conectarse" conecta.txt
          grep -q "busca habló con la red: [1-9]" conecta.txt
          grep -q "busca apunte 33 0" conecta.txt
          grep -q "busca apunte 31 [1-9]" conecta.txt
          test "$(grep -c "chivato pide permiso para conectarse" conecta.txt)" = 2
          test "$(grep -c "chivato habló con la red: -10" conecta.txt)" = 3
          grep -q "chivato apunte 34 0" conecta.txt
          grep -q "chivato apunte 32 0" conecta.txt
          python3 - <<'FIN'
          import struct

          FALOS = bytes.fromhex("525400123456")

          def tramas(nombre):
              datos = open(nombre, "rb").read()
              i = 24
              while i < len(datos):
                  cap = struct.unpack("<I", datos[i + 8:i + 12])[0]
                  yield datos[i + 16:i + 16 + cap]
                  i += 16 + cap

          def suma(trozo):
              if len(trozo) % 2:
                  trozo += b"\0"
              total = sum(struct.unpack("!%dH" % (len(trozo) // 2), trozo))
              while total >> 16:
                  total = (total & 0xFFFF) + (total >> 16)
              return total

          todas = list(tramas("conecta.pcap"))
          salen = [t for t in todas if t[6:12] == FALOS]
          for t in salen:
              assert t[12:14] in (b"\x08\x06", b"\x08\x00"), t[12:14]
              destino = t[38:42] if t[12:14] == b"\x08\x06" else t[30:34]
              assert destino not in (bytes([203, 0, 113, 66]), bytes([198, 51, 100, 23])), "chivato ha llegado a la red"
          udp = [t for t in salen if t[12:14] == b"\x08\x00" and t[23] == 17]
          assert len(udp) == 1, len(udp)
          t = udp[0]
          ip = t[14:34]
          assert suma(ip) == 0xFFFF
          assert ip[16:20] == bytes([10, 0, 2, 3])
          largo = struct.unpack("!H", t[38:40])[0]
          segmento = t[34:34 + largo]
          assert struct.unpack("!H", segmento[2:4])[0] == 53
          falso = ip[12:20] + struct.pack("!BBH", 0, 17, largo)
          assert suma(falso + segmento) == 0xFFFF
          assert b"\x08fal-lang\x03org\x00" in segmento
          vuelven = [t for t in todas if t[0:6] == FALOS and t[12:14] == b"\x08\x00" and t[23] == 17]
          assert vuelven and vuelven[0][26:30] == bytes([10, 0, 2, 3])
          FIN

      - name: Arrancar desde un pendrive, por BIOS y por UEFI, sin tocar ningun disco
        run: |
          sudo apt-get install -y -q grub-pc-bin grub-efi-amd64-bin grub-common xorriso mtools ovmf
          fal haz_disco.fal
          sh usb/haz_usb.sh
          cp falos.iso falos.iso.antes
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 20
            teclea "lanza veces"
            sleep 3
            teclea "deja 1"
            sleep 3
            teclea "lanza veces"
            sleep 3
            teclea "deja 1"
            sleep 3
            teclea "reto"
            sleep 2
            teclea "lanza serpiente"
            sleep 4
            echo "screendump pendrive.ppm"
            sleep 1
            echo quit
          } | timeout 90 qemu-system-x86_64 -m 1024 -display none \
            -device qemu-xhci -drive if=none,id=pendrive,file=falos.iso,format=raw \
            -device usb-storage,drive=pendrive \
            -serial file:pendrive.txt -monitor stdio -no-reboot > /dev/null
          cat pendrive.txt
          if grep -Eq "X  [A-Z]" pendrive.txt; then
            echo "FalOS revento al arrancar desde el pendrive"
            exit 1
          fi
          grep -q "pantalla del cargador: 1024 por 768" pendrive.txt
          grep -q "disco en memoria: 4096" pendrive.txt
          grep -q "veces leyó del disco: -3" pendrive.txt
          grep -q "veces guardó en el disco: 2" pendrive.txt
          grep -q "veces leyó del disco: 2" pendrive.txt
          cmp falos.iso falos.iso.antes
          cp /usr/share/OVMF/OVMF_VARS_4M.fd variables.fd
          {
            sleep 30
            echo "screendump uefi.ppm"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -m 1024 -display none \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd \
            -drive if=pflash,format=raw,file=variables.fd \
            -device qemu-xhci -drive if=none,id=pendrive,file=falos.iso,format=raw \
            -device usb-storage,drive=pendrive \
            -serial file:uefi.txt -monitor stdio -no-reboot > /dev/null
          tr -d '\033' < uefi.txt | grep -a -E "FalOS|pantalla|disco|X  " || true
          if grep -a -Eq "X  [A-Z]" uefi.txt; then
            echo "FalOS revento al arrancar por UEFI"
            exit 1
          fi
          grep -a -q "pantalla del cargador: 1024 por 768" uefi.txt
          grep -a -q "disco en memoria: 4096" uefi.txt
          grep -a -q "pantalla lista" uefi.txt

      - name: Apuntar con qué Fal se ha hecho
        run: git -C /tmp/fal rev-parse HEAD > fal.txt

      - uses: actions/upload-artifact@v4
        with:
          name: falos-pendrive
          path: |
            falos.iso
            sistema.bin
            disco.img
            fal.txt
            pendrive.ppm
            uefi.ppm

  publicar:
    needs: arrancar
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: falos-pendrive
          path: imagen

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar Fal para Linux, Windows y Mac
        run: |
          git clone https://github.com/NissanBoss/Fal.git /tmp/fal
          git -C /tmp/fal checkout "$(cat imagen/fal.txt)"
          cd /tmp/fal
          GOOS=linux GOARCH=amd64 go build -trimpath -o "$GITHUB_WORKSPACE/imagen/fal-linux" .
          GOOS=windows GOARCH=amd64 go build -trimpath -o "$GITHUB_WORKSPACE/imagen/fal-windows.exe" .
          GOOS=darwin GOARCH=arm64 go build -trimpath -o "$GITHUB_WORKSPACE/imagen/fal-mac" .

      - name: Publicar la imagen
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETA: ${{ github.ref_name }}
        run: |
          cd imagen
          sha256sum falos.iso sistema.bin disco.img fal-linux fal-windows.exe fal-mac > sha256.txt
          cat > notas.md <<FIN
          Lo ha hecho GitHub desde el commit $GITHUB_SHA, después de pasar todas las pruebas de [arranca.yml](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). No sale de mi ordenador.

          - **falos.iso**: para un pendrive. Grábala con [Rufus](https://rufus.ie) en modo Imagen DD, o con dd. Arranca por BIOS y por UEFI, sin Secure Boot, y no toca el disco del ordenador.
          - **sistema.bin** y **disco.img**: para QEMU. \`qemu-system-x86_64 -kernel sistema.bin -drive file=disco.img,format=raw,if=ide\`, y con \`-nic user,model=ne2k_pci\` tiene red.
          - **fal-linux**, **fal-windows.exe** y **fal-mac**: el compilador de Fal con el que se hizo, del commit $(cat fal.txt) de [Fal](https://github.com/NissanBoss/Fal). Con él compilas tus programas para meterlos en el disco.

          ¿Crees que puedes romperlo? Las reglas están en [RETO.md](https://github.com/$GITHUB_REPOSITORY/blob/$ETIQUETA/RETO.md).

          \`\`\`
          $(cat sha256.txt)
          \`\`\`
          FIN
          gh release create "$ETIQUETA" falos.iso sistema.bin disco.img fal-linux fal-windows.exe fal-mac sha256.txt \
            --repo "$GITHUB_REPOSITORY" --title "FalOS, $ETIQUETA" --notes-file notas.md
