name: Arranca

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrancar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar Fal
        run: |
          git clone --depth 1 https://github.com/NissanBoss/Fal.git /tmp/fal
          cd /tmp/fal && go build -o /usr/local/bin/fal .

      - name: Instalar QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86

      - name: Compilar FalOS y su disco
        run: |
          fal --nucleo sistema.fal 2> avisos.txt
          fal haz_disco.fal 2>> avisos.txt
          cat avisos.txt
          if grep -q "^  !" avisos.txt; then
            echo "Una variable pisa una constante"
            exit 1
          fi

      - name: Arrancar
        run: |
          timeout 20 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:serie.txt -no-reboot || true
          cat serie.txt
          if grep -Eq "X  [A-Z]" serie.txt; then
            echo "FalOS revento al arrancar"
            exit 1
          fi
          grep -q "pantalla lista" serie.txt

      - name: Programas que intentan lo que no deben
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza apaga"
            sleep 4
            teclea "lanza espia"
            sleep 4
            teclea "lanza apaga"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:programas.txt -monitor stdio -no-reboot > /dev/null
          cat programas.txt
          if grep -Eq "X  [A-Z]" programas.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "apaga cerrado por la excepción 13" programas.txt)" = 2
          grep -q "espia cerrado por la excepción 14" programas.txt

      - name: El núcleo no está en las tablas de los programas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            sleep 2
            teclea "tablas 1"
            teclea "tablas 10"
            sleep 1
            teclea "lanza espia"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:tablas.txt -monitor stdio -no-reboot > /dev/null
          cat tablas.txt
          if grep -Eq "X  [A-Z]" tablas.txt; then
            echo "Cambiar de tablas ha tumbado a FalOS"
            exit 1
          fi
          grep -q "espia no tiene el núcleo en sus tablas" tablas.txt
          grep -q "espia cerrado por la excepción 14" tablas.txt
          for quien in bucle consola; do
            linea=$(grep "$quien tablas: " tablas.txt)
            nucleo=$(echo "$linea" | sed 's/.* suyas, \([0-9]*\) del núcleo.*/\1/')
            antes=$(echo "$linea" | sed 's/.*antes \([0-9]*\).*/\1/')
            echo "$quien ve $nucleo páginas del núcleo; antes, $antes"
            test "$nucleo" -gt 0
            test "$nucleo" -lt 16
            test "$antes" -gt 100000
          done

      - name: Permisos que se dan y se quitan
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza caja"
            teclea "lanza curioso"
            teclea "lanza ladron"
            sleep 2
            teclea "permite 2 1"
            sleep 3
            teclea "prohibe 2 1"
            sleep 1
            teclea "para 3"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:permisos.txt -monitor stdio -no-reboot > /dev/null
          cat permisos.txt
          if grep -Eq "X  [A-Z]" permisos.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          grep -Eq "curioso pierde el permiso tras [1-9]" permisos.txt
          grep -Eq "ladron cerrado con 0 preguntas y [1-9]" permisos.txt

      - name: El teclado y el disco se cuelgan y vuelven
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga teclado"
            sleep 3
            teclea "lanza apaga"
            sleep 2
            teclea "rompe teclado"
            sleep 2
            teclea "cuelga disco"
            sleep 3
            teclea "rompe disco"
            sleep 2
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza fisgon"
            sleep 3
            teclea "lanza impostor"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 80 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:aparatos.txt -monitor stdio -no-reboot > /dev/null
          cat aparatos.txt
          if grep -Eq "X  [A-Z]" aparatos.txt; then
            echo "Un aparato ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -Ec "archivo leido: [1-9]" aparatos.txt)" = 2
          grep -q "teclado reiniciado, y van 2" aparatos.txt
          grep -q "disco reiniciado, y van 2" aparatos.txt
          grep -q "apaga cerrado por la excepción 13" aparatos.txt
          grep -q "fisgon cerrado por la excepción 13" aparatos.txt
          grep -Eq "impostor cerrado con 0 preguntas y [1-9]" aparatos.txt

      - name: Discos hechos para romperlo
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          python3 - <<'FIN'
          sector = 512
          indice = (b"FALDISC2\n"
                    b"bien.txt 2 11\n"
                    b"vacio.txt 2 0\n"
                    b"lejos.txt 99999999 10\n"
                    b"gigante.txt 2 999999999999999999999999999\n"
                    b"negativo.txt -5 10\n"
                    b"nombre_de_mas_de_treinta_y_dos_letras_seguidas.txt 2 5\n"
                    b"ra\x07ro.txt 2 5\n"
                    b"grande.txt 2 31744\n")
          open("malo.img", "wb").write(indice.ljust(sector * 2, b" ") + b"hola, malo\n".ljust(sector * 62, b"x"))
          open("sin_salto.img", "wb").write(b"FALDISC2\n" + b"a" * (sector * 32 - 9))
          open("ruido.img", "wb").write(bytes(range(256)) * 128)
          FIN
          for disco in malo sin_salto ruido; do
            {
              sleep 4
              teclea "disco"
              sleep 2
              teclea "lee vacio.txt"
              sleep 1
              teclea "lee gigante.txt"
              sleep 1
              teclea "lee grande.txt"
              sleep 2
              teclea "lee"
              sleep 1
              teclea "lee bien.txt"
              sleep 1
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$disco.img,format=raw,if=ide \
              -serial file:$disco.txt -monitor stdio -no-reboot > /dev/null
            cat $disco.txt
            if grep -Eq "X  [A-Z]" $disco.txt; then
              echo "El disco $disco ha tumbado a FalOS"
              exit 1
            fi
          done
          grep -q "archivo leido: 4096" malo.txt

      - name: Lo que ya tumbo a FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza larga"
            for orden in a b c d e f g h i j k l m n o p q r s t; do
              teclea "$orden"
            done
            sleep 1
            teclea "para 4"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:antes.txt -monitor stdio -no-reboot > /dev/null
          cat antes.txt
          if grep -Eq "X  [A-Z]" antes.txt; then
            echo "Ha vuelto un fallo viejo"
            exit 1
          fi
          grep -q "larga cerrado con" antes.txt
          if grep -q "reiniciado" antes.txt; then
            echo "Un programa que solo gasta procesador ha tumbado un controlador"
            exit 1
          fi

      - name: Una sola llamada que tumbaba FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza tumba"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:tumba.txt -monitor stdio -no-reboot > /dev/null
          cat tumba.txt
          if grep -Eq "X  [A-Z]" tumba.txt; then
            echo "Guardar, leer o conectar desde el final de la memoria ha vuelto a tumbar a FalOS"
            exit 1
          fi
          grep -q "tumba recibió 0 teclas" tumba.txt
          if grep -q "tumba cerrado por" tumba.txt; then
            echo "tumba no ha llegado al final"
            exit 1
          fi
          grep -q "cuenta cerrado con" tumba.txt
          if grep -q "no hay controlador PS/2" tumba.txt; then
            echo "FalOS dice que no hay teclado con el teclado delante"
            exit 1
          fi

      - name: La consola es un programa, y si se rompe o se cuelga FalOS sigue
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "rompe consola"
            sleep 3
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga consola"
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "para 10"
            sleep 3
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza mandon"
            sleep 4
            teclea "para 1"
            sleep 2
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:consola.txt -monitor stdio -no-reboot > /dev/null
          cat consola.txt
          if grep -Eq "X  [A-Z]" consola.txt; then
            echo "Romper la consola ha tumbado a FalOS"
            exit 1
          fi
          grep -q "consola cerrado por la excepción 13" consola.txt
          grep -q "consola reiniciado, y van 1" consola.txt
          grep -q "consola reiniciado, y van 2" consola.txt
          grep -q "consola cerrado con 0 preguntas" consola.txt
          grep -q "consola reiniciado, y van 3" consola.txt
          test "$(grep -c "archivo leido: " consola.txt)" = 3
          grep -q "mandon cerrado con 0 preguntas y 3 rechazadas" consola.txt
          if grep -q "modo invitado\|permisos.sis guardado" consola.txt; then
            echo "Un programa ha dado órdenes como si fuera la consola"
            exit 1
          fi

      - name: Ninguna ventana tapa una pregunta de permiso
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza trampa"
            sleep 1
            teclea "teclado 1"
            teclea "x"
            sleep 2
            echo "screendump preguntando.ppm"
            sleep 1
            teclea "niega 1"
            sleep 2
            echo "screendump contestado.ppm"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide -nic user,model=ne2k_pci \
            -serial file:trampa.txt -monitor stdio -no-reboot > /dev/null
          cat trampa.txt
          if grep -Eq "X  [A-Z]" trampa.txt; then
            echo "La trampa ha tumbado a FalOS"
            exit 1
          fi
          grep -q "trampa pide permiso para conectarse" trampa.txt
          grep -q "trampa habló con la red: -10" trampa.txt
          python3 - <<'FIN'
          for nombre, ventana in (("preguntando.ppm", False), ("contestado.ppm", True)):
              pixeles = open(nombre, "rb").read().split(b"\n", 3)[3]
              verde = sum(1 for i in range(0, len(pixeles), 3) if pixeles[i:i + 3] == bytes((86, 211, 100)))
              print(nombre, verde)
              assert (verde > 3000) == ventana, nombre
          FIN

      - name: Un ordenador sin teclado PS/2
        run: |
          {
            sleep 6
            echo quit
          } | timeout 30 qemu-system-x86_64 -machine q35,i8042=off -kernel sistema.bin -display none \
            -serial file:sin_teclado.txt -monitor stdio -no-reboot > /dev/null
          cat sin_teclado.txt
          if grep -Eq "X  [A-Z]" sin_teclado.txt; then
            echo "Arrancar sin controlador de teclado ha tumbado a FalOS"
            exit 1
          fi
          grep -q "teclado: no hay controlador PS/2" sin_teclado.txt
          grep -q "pantalla lista" sin_teclado.txt

      - name: Archivos del disco que mienten
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza gigante"
            teclea "lanza desborda"
            teclea "lanza fuera"
            teclea "lanza corto"
            teclea "lanza carta"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:mentiras.txt -monitor stdio -no-reboot > /dev/null
          cat mentiras.txt
          if grep -Eq "X  [A-Z]" mentiras.txt; then
            echo "Un archivo ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "^rechazado: " mentiras.txt)" = 5
          grep -q "cuenta cerrado con" mentiras.txt

      - name: Dos archivos con el mismo nombre
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          cp programas/cuenta.fal disco/serpiente.prg
          if fal haz_disco.fal; then
            echo "haz_disco ha metido dos serpiente.prg"
            exit 1
          fi
          rm disco/serpiente.prg
          printf 'escribe "hola"\n' > "programas/Mal.fal"
          if fal haz_disco.fal; then
            echo "haz_disco ha metido un nombre con mayúsculas"
            exit 1
          fi
          rm programas/Mal.fal
          fal haz_disco.fal > /dev/null
          python3 - <<'FIN'
          imagen = open("disco.img", "rb").read()
          indice = imagen[:1024].split(b"\n\n")[0]
          linea = {l.split()[0]: l for l in indice.split(b"\n")[1:]}
          falsa = linea[b"cuenta.prg"].replace(b"cuenta.prg", b"serpiente.prg")
          indice = indice.replace(linea[b"serpiente.prg"], falsa + b"\n" + linea[b"serpiente.prg"]) + b"\n\n"
          open("repetido.img", "wb").write(indice.ljust(1024, b" ") + imagen[1024:])
          FIN
          {
            sleep 4
            teclea "lanza serpiente"
            sleep 2
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=repetido.img,format=raw,if=ide \
            -serial file:repetido.txt -monitor stdio -no-reboot > /dev/null
          cat repetido.txt
          if grep -Eq "X  [A-Z]" repetido.txt; then
            echo "Un nombre repetido ha tumbado a FalOS"
            exit 1
          fi
          if grep -q "serpiente" repetido.txt; then
            echo "FalOS ha lanzado una serpiente de las dos"
            exit 1
          fi
          grep -q "cuenta cerrado con" repetido.txt

      - name: La pantalla se cuelga y vuelve
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            echo "screendump antes.ppm"
            sleep 1
            teclea "cuelga pantalla"
            sleep 3
            teclea "rompe pantalla"
            sleep 2
            teclea "ayuda"
            sleep 2
            echo "screendump despues.ppm"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:graficos.txt -monitor stdio -no-reboot > /dev/null
          cat graficos.txt
          if grep -Eq "X  [A-Z]" graficos.txt; then
            echo "La pantalla ha tumbado a FalOS"
            exit 1
          fi
          grep -q "pantalla reiniciado, y van 2" graficos.txt
          grep -q "pantalla cerrado por la excepción 13" graficos.txt
          python3 - <<'FIN'
          for nombre in ("antes.ppm", "despues.ppm"):
              datos = open(nombre, "rb").read()
              cabecera = datos.split(b"\n", 3)
              assert cabecera[1] == b"960 600", cabecera[1]
              colores = {cabecera[3][i:i + 3] for i in range(0, len(cabecera[3]), 3)}
              assert len(colores) > 3, nombre
          FIN

      - name: Ventanas y raton
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza disfraz"
            teclea "lanza cuenta"
            teclea "lanza larga"
            sleep 3
            echo "screendump ventanas.ppm"
            sleep 1
            echo "mouse_move 354 -48"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 1
            echo "mouse_move 72 -192"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 2
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:ventanas.txt -monitor stdio -no-reboot > /dev/null
          cat ventanas.txt
          if grep -Eq "X  [A-Z]" ventanas.txt; then
            echo "Las ventanas han tumbado a FalOS"
            exit 1
          fi
          grep -q "ratón listo" ventanas.txt
          grep -q "cuenta cerrado con" ventanas.txt
          grep -q "bucle cerrado con" ventanas.txt
          python3 - <<'FIN'
          datos = open("ventanas.ppm", "rb").read()
          cabecera = datos.split(b"\n", 3)
          pixeles = cabecera[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
              cuantos[p] = cuantos.get(p, 0) + 1
          for nombre, color in [("verde", (86, 211, 100)), ("amarillo", (227, 179, 65)),
                                ("lila", (210, 168, 255)), ("cian", (57, 197, 207))]:
              hay = cuantos.get(bytes(color), 0)
              print(nombre, hay)
              assert hay > 3000, nombre
          FIN

      - name: Un juego, y el teclado solo para quien tu digas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza disfraz"
            teclea "lanza serpiente"
            sleep 2
            teclea "secreto"
            sleep 1
            teclea "teclado 2"
            sleep 1
            echo "sendkey up"
            sleep 0.5
            echo "sendkey right"
            sleep 1
            echo "screendump juego.ppm"
            sleep 1
            echo "sendkey esc"
            sleep 0.5
            teclea "para 2"
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:juego.txt -monitor stdio -no-reboot > /dev/null
          cat juego.txt
          if grep -Eq "X  [A-Z]" juego.txt; then
            echo "El juego ha tumbado a FalOS"
            exit 1
          fi
          grep -q "disfraz recibió 0 teclas" juego.txt
          grep -Eq "serpiente recibió [1-9]" juego.txt
          grep -q "serpiente cerrado con" juego.txt
          python3 - <<'FIN'
          datos = open("juego.ppm", "rb").read()
          pixeles = datos.split(b"\n", 3)[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
