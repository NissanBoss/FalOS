name: Arranca

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arrancar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Compilar Fal
        run: |
          git clone --depth 1 https://github.com/NissanBoss/Fal.git /tmp/fal
          cd /tmp/fal && go build -o /usr/local/bin/fal .

      - name: Instalar QEMU
        run: sudo apt-get update -q && sudo apt-get install -y -q qemu-system-x86

      - name: Compilar FalOS y su disco
        run: |
          fal --nucleo sistema.fal 2> avisos.txt
          fal haz_disco.fal 2>> avisos.txt
          cat avisos.txt
          if grep -q "^  !" avisos.txt; then
            echo "Una variable pisa una constante"
            exit 1
          fi

      - name: Arrancar
        run: |
          timeout 20 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:serie.txt -no-reboot || true
          cat serie.txt
          if grep -q "  X  " serie.txt; then
            echo "FalOS revento al arrancar"
            exit 1
          fi
          grep -q "pantalla lista" serie.txt

      - name: Programas que intentan lo que no deben
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza apaga"
            sleep 4
            teclea "lanza espia"
            sleep 4
            teclea "lanza apaga"
            sleep 4
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:programas.txt -monitor stdio -no-reboot > /dev/null
          cat programas.txt
          if grep -q "  X  " programas.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "apaga cerrado por la excepción 13" programas.txt)" = 2
          grep -q "espia cerrado por la excepción 14" programas.txt

      - name: Permisos que se dan y se quitan
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/./& /g; s/  / spc /g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza caja"
            teclea "lanza curioso"
            teclea "lanza ladron"
            sleep 2
            teclea "permite 2 1"
            sleep 3
            teclea "prohibe 2 1"
            sleep 1
            teclea "para 3"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:permisos.txt -monitor stdio -no-reboot > /dev/null
          cat permisos.txt
          if grep -q "  X  " permisos.txt; then
            echo "Un programa ha tumbado a FalOS"
            exit 1
          fi
          grep -Eq "curioso pierde el permiso tras [1-9]" permisos.txt
          grep -Eq "ladron cerrado con 0 preguntas y [1-9]" permisos.txt

      - name: El teclado y el disco se cuelgan y vuelven
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lee carta.txt"
            sleep 2
            teclea "cuelga teclado"
            sleep 3
            teclea "lanza apaga"
            sleep 2
            teclea "rompe teclado"
            sleep 2
            teclea "cuelga disco"
            sleep 3
            teclea "rompe disco"
            sleep 2
            teclea "lee carta.txt"
            sleep 2
            teclea "lanza fisgon"
            sleep 3
            teclea "lanza impostor"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 80 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:aparatos.txt -monitor stdio -no-reboot > /dev/null
          cat aparatos.txt
          if grep -q "  X  " aparatos.txt; then
            echo "Un aparato ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -Ec "archivo leido: [1-9]" aparatos.txt)" = 2
          grep -q "teclado reiniciado, y van 2" aparatos.txt
          grep -q "disco reiniciado, y van 2" aparatos.txt
          grep -q "apaga cerrado por la excepción 13" aparatos.txt
          grep -q "fisgon cerrado por la excepción 13" aparatos.txt
          grep -Eq "impostor cerrado con 0 preguntas y [1-9]" aparatos.txt

      - name: Discos hechos para romperlo
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          python3 - <<'FIN'
          sector = 512
          indice = (b"FALDISCO\n"
                    b"bien.txt 1 11\n"
                    b"vacio.txt 1 0\n"
                    b"lejos.txt 99999999 10\n"
                    b"gigante.txt 1 999999999999999999999999999\n"
                    b"negativo.txt -5 10\n"
                    b"nombre_de_mas_de_treinta_y_dos_letras_seguidas.txt 1 5\n"
                    b"ra\x07ro.txt 1 5\n"
                    b"grande.txt 1 32256\n")
          open("malo.img", "wb").write(indice.ljust(sector, b" ") + b"hola, malo\n".ljust(sector * 63, b"x"))
          open("sin_salto.img", "wb").write(b"FALDISCO\n" + b"a" * (sector * 32 - 9))
          open("ruido.img", "wb").write(bytes(range(256)) * 128)
          FIN
          for disco in malo sin_salto ruido; do
            {
              sleep 4
              teclea "disco"
              sleep 2
              teclea "lee vacio.txt"
              sleep 1
              teclea "lee gigante.txt"
              sleep 1
              teclea "lee grande.txt"
              sleep 2
              teclea "lee"
              sleep 1
              teclea "lee bien.txt"
              sleep 1
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$disco.img,format=raw,if=ide \
              -serial file:$disco.txt -monitor stdio -no-reboot > /dev/null
            cat $disco.txt
            if grep -q "  X  " $disco.txt; then
              echo "El disco $disco ha tumbado a FalOS"
              exit 1
            fi
          done
          grep -q "archivo leido: 4096" malo.txt

      - name: Lo que ya tumbo a FalOS
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza bucle"
            teclea "lanza larga"
            for orden in a b c d e f g h i j k l m n o p q r s t; do
              teclea "$orden"
            done
            sleep 1
            teclea "para 4"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:antes.txt -monitor stdio -no-reboot > /dev/null
          cat antes.txt
          if grep -q "  X  " antes.txt; then
            echo "Ha vuelto un fallo viejo"
            exit 1
          fi
          grep -q "larga cerrado con" antes.txt
          if grep -q "reiniciado" antes.txt; then
            echo "Un programa que solo gasta procesador ha tumbado un controlador"
            exit 1
          fi

      - name: Archivos del disco que mienten
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza gigante"
            teclea "lanza desborda"
            teclea "lanza fuera"
            teclea "lanza corto"
            teclea "lanza carta"
            sleep 3
            teclea "lanza cuenta"
            sleep 2
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:mentiras.txt -monitor stdio -no-reboot > /dev/null
          cat mentiras.txt
          if grep -q "  X  " mentiras.txt; then
            echo "Un archivo ha tumbado a FalOS"
            exit 1
          fi
          test "$(grep -c "^rechazado: " mentiras.txt)" = 5
          grep -q "cuenta cerrado con" mentiras.txt

      - name: La pantalla se cuelga y vuelve
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            echo "screendump antes.ppm"
            sleep 1
            teclea "cuelga pantalla"
            sleep 3
            teclea "rompe pantalla"
            sleep 2
            teclea "ayuda"
            sleep 2
            echo "screendump despues.ppm"
            sleep 1
            echo quit
          } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:graficos.txt -monitor stdio -no-reboot > /dev/null
          cat graficos.txt
          if grep -q "  X  " graficos.txt; then
            echo "La pantalla ha tumbado a FalOS"
            exit 1
          fi
          grep -q "pantalla reiniciado, y van 2" graficos.txt
          grep -q "pantalla cerrado por la excepción 13" graficos.txt
          python3 - <<'FIN'
          for nombre in ("antes.ppm", "despues.ppm"):
              datos = open(nombre, "rb").read()
              cabecera = datos.split(b"\n", 3)
              assert cabecera[1] == b"960 600", cabecera[1]
              colores = {cabecera[3][i:i + 3] for i in range(0, len(cabecera[3]), 3)}
              assert len(colores) > 3, nombre
          FIN

      - name: Ventanas y raton
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza bucle"
            teclea "lanza disfraz"
            teclea "lanza cuenta"
            teclea "lanza larga"
            sleep 3
            echo "screendump ventanas.ppm"
            sleep 1
            echo "mouse_move 354 -48"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 1
            echo "mouse_move 72 -192"
            sleep 0.5
            echo "mouse_button 1"
            sleep 0.3
            echo "mouse_button 0"
            sleep 2
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:ventanas.txt -monitor stdio -no-reboot > /dev/null
          cat ventanas.txt
          if grep -q "  X  " ventanas.txt; then
            echo "Las ventanas han tumbado a FalOS"
            exit 1
          fi
          grep -q "ratón listo" ventanas.txt
          grep -q "cuenta cerrado con" ventanas.txt
          grep -q "bucle cerrado con" ventanas.txt
          python3 - <<'FIN'
          datos = open("ventanas.ppm", "rb").read()
          cabecera = datos.split(b"\n", 3)
          pixeles = cabecera[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
              cuantos[p] = cuantos.get(p, 0) + 1
          for nombre, color in [("verde", (86, 211, 100)), ("amarillo", (227, 179, 65)),
                                ("lila", (210, 168, 255)), ("cian", (57, 197, 207))]:
              hay = cuantos.get(bytes(color), 0)
              print(nombre, hay)
              assert hay > 3000, nombre
          FIN

      - name: Un juego, y el teclado solo para quien tu digas
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          {
            sleep 4
            teclea "lanza disfraz"
            teclea "lanza serpiente"
            sleep 2
            teclea "secreto"
            sleep 1
            teclea "teclado 2"
            sleep 1
            echo "sendkey up"
            sleep 0.5
            echo "sendkey right"
            sleep 1
            echo "screendump juego.ppm"
            sleep 1
            echo "sendkey esc"
            sleep 0.5
            teclea "para 2"
            teclea "para 1"
            sleep 1
            echo quit
          } | timeout 60 qemu-system-x86_64 -kernel sistema.bin -display none \
            -drive file=disco.img,format=raw,if=ide \
            -serial file:juego.txt -monitor stdio -no-reboot > /dev/null
          cat juego.txt
          if grep -q "  X  " juego.txt; then
            echo "El juego ha tumbado a FalOS"
            exit 1
          fi
          grep -q "disfraz recibió 0 teclas" juego.txt
          grep -Eq "serpiente recibió [1-9]" juego.txt
          grep -q "serpiente cerrado con" juego.txt
          python3 - <<'FIN'
          datos = open("juego.ppm", "rb").read()
          pixeles = datos.split(b"\n", 3)[3]
          cuantos = {}
          for i in range(0, len(pixeles), 3):
              p = pixeles[i:i + 3]
              cuantos[p] = cuantos.get(p, 0) + 1
          for nombre, color, minimo in [("la ventana", (227, 179, 65), 3000),
                                        ("la comida", (248, 113, 104), 500)]:
              hay = cuantos.get(bytes(color), 0)
              print(nombre, hay)
              assert hay > minimo, nombre
          FIN

      - name: Escribir en el disco sin pisar nada
        run: |
          teclea() {
            for letra in $(echo "$1" | sed 's/\./@/g; s/./& /g; s/  / spc /g; s/@/dot/g'); do
              echo "sendkey $letra"
              sleep 0.1
            done
            echo "sendkey ret"
          }
          lanza_veces() {
            {
              sleep 4
              teclea "lanza veces"
              sleep 3
              echo quit
            } | timeout 40 qemu-system-x86_64 -kernel sistema.bin -display none \
              -drive file=$1,format=raw,if=ide \
              -serial file:$2 -monitor stdio -no-reboot > /dev/null
            cat $2
            if grep -q "  X  " $2; then
              echo "Escribir en el disco ha tumbado a FalOS"
              exit 1
            fi
          }
          lanza_veces disco.img veces1.txt
          lanza_veces disco.img veces2.txt
          grep -q "veces leyó del disco: -3" veces1.txt
          grep -q "veces guardó en el disco: 2" veces1.txt
          grep -q "veces leyó del disco: 2" veces2.txt
          python3 - <<'FIN'
          imagen = open("disco.img", "rb").read()
          lineas = imagen[:512].split(b"\n\n")[0].split(b"\n")[1:]
          sitio = {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}
          sector, medida = sitio[b"veces.dat"]
          assert imagen[sector * 512:sector * 512 + medida] == b"2\n"
          sector, medida = sitio[b"veces.prg"]
          programa = imagen[sector * 512:sector * 512 + medida]
          open("veces.prg", "wb").write(programa)
          huecos = (medida + 511) // 512

          def disco(nombre, lineas):
              indice = b"FALDISCO\n" + b"".join(lineas) + b"\n"
              assert len(indice) <= 512
              datos = indice.ljust(512, b" ") + programa.ljust(huecos * 512, b"\0") + bytes(512 * 64)
              open(nombre, "wb").write(datos)
              open(nombre + ".antes", "wb").write(datos)

          suyo = b"veces.prg 1 %d\n" % medida
          disco("pisa.img", [suyo, b"veces.dat 1 2\n"])
          disco("roto.img", [suyo, b"ra\x07ro.txt 1 5\n"])
          lleno = [suyo]
          mide = lambda: len(b"FALDISCO\n" + b"".join(lleno) + b"\n")
          while mide() < 480:
              lleno.append(b"relleno%02d.txt 1 5\n" % len(lleno))
          lleno.append(b"r" * (500 - mide()) + b" 1 5\n")
          disco("lleno.img", lleno)
          FIN
          for disco in pisa roto lleno; do
            lanza_veces $disco.img $disco.txt
          done
          grep -q "veces guardó en el disco: 2" pisa.txt
          grep -q "veces guardó en el disco: -5" roto.txt
          grep -q "veces guardó en el disco: -7" lleno.txt
          cmp roto.img roto.img.antes
          cmp lleno.img lleno.img.antes
          python3 - <<'FIN'
          imagen = open("pisa.img", "rb").read()
          programa = open("veces.prg", "rb").read()
          assert imagen[512:512 + len(programa)] == programa
          lineas = imagen[:512].split(b"\n\n")[0].split(b"\n")[1:]
          sitio = {l.split()[0]: (int(l.split()[1]), int(l.split()[2])) for l in lineas}
          sector, medida = sitio[b"veces.dat"]
          assert sector != 1
          assert imagen[sector * 512:sector * 512 + medida] == b"1\n"
          FIN
