          import os, re, socket, struct, subprocess, sys, threading, time

          DE_VERDAD = bytes.fromhex("020102030405")
          CON = ["-device", "intel-iommu,intremap=on"]
          TARJETA = ["-device", "e1000e,netdev=n1,id=tj,mac=" + DE_VERDAD.hex(":")]
          GALLETA = bytes.fromhex("63825363")
