                      sys.exit("La red ha tumbado a FalOS")

          def suma(trozo):
              if len(trozo) % 2:
                  trozo += b"\0"
              total = sum(struct.unpack("!%dH" % (len(trozo) // 2), trozo))
              while total >> 16:
                  total = (total & 0xFFFF) + (total >> 16)
              return total

          def ip(texto):
              return socket.inet_aton(texto)

          def tramas(nombre):
              datos = open(nombre, "rb").read()
              i = 24
              while i < len(datos):
                  cap = struct.unpack("<I", datos[i + 8:i + 12])[0]
                  yield datos[i + 16:i + 16 + cap]
                  i += 16 + cap

          def opciones_de(bootp):
              assert bootp[236:240] == GALLETA
              salen, i = {}, 240
              while bootp[i] != 255:
                  salen[bootp[i]] = bootp[i + 2:i + 2 + bootp[i + 1]]
                  i += 2 + bootp[i + 1]
              return salen

          def mira_lo_que_sale(salen):
              caras = set()
              for t in salen:
                  assert DE_VERDAD not in t, "sale la dirección de fábrica"
                  assert t[6] % 4 == 2, "esa dirección no es de las puestas a mano: " + t[6:12].hex()
                  assert len(t) < 400, "una trama de %d bytes" % len(t)
                  caras.add(t[6:12])
                  if t[12:14] == b"\x08\x06":
                      assert t[22:28] == t[6:12]
                      continue
                  assert t[12:14] == b"\x08\x00", t[12:14].hex()
                  assert suma(t[14:34]) == 0xFFFF
                  if t[23] == 1:
                      continue
                  assert t[23] == 17
                  largo = struct.unpack("!H", t[38:40])[0]
                  assert suma(t[26:34] + struct.pack("!BBH", 0, 17, largo) + t[34:34 + largo]) == 0xFFFF
                  de, a = struct.unpack("!HH", t[34:38])
                  if a == 67:
                      bootp = t[42:]
                      assert de == 68 and bootp[28:34] == t[6:12] and bootp[34:236] == bytes(202)
                      quiere = opciones_de(bootp)
