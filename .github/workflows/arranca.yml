          o.espera("fal pide permiso para guardar cuentas")
          o.en_pantalla("fal quiere guardar cuentas en el disco, cifrado:", "Si le dejas: deja 1. Si no: niega 1.")
          o.orden("deja 1")
          o.espera("cuentas guardado en el disco: ")
          o.orden("teclado 1", 0.5)
          o.en_pantalla("bytes, guardado y cifrado.")
          o.pide("sendkey esc", 0.5)
          o.orden("para 1")
          o.compila('escribe "no me guardes"', "nada")
          o.espera("fal pide permiso para guardar nada")
          o.orden("niega 1")
          o.orden("teclado 1", 0.5)
          o.en_pantalla("No lo dejaste guardar:")
          o.pide("sendkey esc", 0.5)
          o.orden("para 1")
          o.orden("lanza falsario", 3)
          o.espera("falsario pide permiso para guardar guarda")
          o.orden("niega 1", 3)
          o.orden("teclado 1", 0.5)
          o.en_pantalla("cuentas, que hizo fal: -33", "guarda, hecho a mano: 2")
          o.pide("sendkey esc", 0.5)
          o.orden("para 1")
          o.orden("programas", 2)
          o.en_pantalla("Hechos aquí:", "bytes, de fal, guardado y cifrado", "bytes, de fal, solo en memoria",
                        "74 bytes, de falsario, solo en memoria")
          o.orden("registro", 2)
          o.en_pantalla("se guardó en el disco, cifrado y con su código:")
          o.fuera()

          imagen, z = zona()
          for claro in (b"funcion doble con n", b"devuelve n por 2", b"no me guardes", b"cuentas"):
              assert claro not in z, claro
          assert b"funcion doble" not in imagen and b"no me guardes" not in imagen
          assert hueco_lleno() == [0], hueco_lleno()

          o = Ordenador("quedan2")
          o.espera("hecho vuelve: cuentas")
          o.no_dice("hecho vuelve: nada", "hecho vuelve: guarda", "hecho tocado")
          o.en_pantalla("Han vuelto del disco 1 programa que hiciste aquí.")
          o.orden("lanza cuentas", 3)
          o.espera("hecho aqui: cuentas")
          o.en_pantalla("2", "4", "6", "año y canción")
          o.orden("para 1")
          o.orden("lanza fal")
          o.orden("teclado 1", 0.5)
          o.en_pantalla("Fin abre uno tuyo: cuentas")
          o.pide("sendkey end", 0.5)
          o.en_pantalla("¿Cuál abro? cuentas.")
          o.escribe("cuentas")
          o.pide("sendkey ret", 1)
          o.en_pantalla("funcion doble con n", "devuelve n por 2", "Abierto.")
          o.pide("sendkey esc", 0.5)
          o.orden("para 1")
          o.orden("lanza falsario", 3)
          o.orden("teclado 1", 0.5)
          o.en_pantalla("cuentas, que hizo fal: -33")
          o.fuera()

          imagen = bytearray(open("quedan.img", "rb").read())
          sitio = (ZONA + 1) * 512 + 300
          imagen[sitio] ^= 1
          open("quedan.img", "wb").write(imagen)
          o = Ordenador("quedan3")
          o.espera("hecho tocado: hueco 1")
          o.no_dice("hecho vuelve")
          o.en_pantalla("Un programa guardado no cuadra: alguien ha tocado el disco. No lo cargo.")
          o.orden("lanza cuentas", 2)
          o.no_dice("hecho aqui: cuentas")
          o.fuera()
          imagen[sitio] ^= 1
          open("quedan.img", "wb").write(imagen)

          o = Ordenador("quedan4")
          o.espera("hecho vuelve: cuentas")
          o.orden("invitado", 3)
          o.orden("programas", 2)
          o.orden("lanza cuentas", 2)
          o.no_dice("hecho aqui: cuentas")
