            done
            echo "sendkey ret"
          }
          x=480
          y=300
          raton() {
            dx=$(( $1 - x ))
            dy=$(( $2 - y ))
            while [ $dx -ne 0 ] || [ $dy -ne 0 ]; do
              px=$dx
              py=$dy
              [ $px -gt 100 ] && px=100
              [ $px -lt -100 ] && px=-100
              [ $py -gt 100 ] && py=100
              [ $py -lt -100 ] && py=-100
              echo "mouse_move $px $py"
              sleep 0.15
              dx=$(( dx - px ))
              dy=$(( dy - py ))
            done
            x=$1
            y=$2
            sleep 0.3
          }
